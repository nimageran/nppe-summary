<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter 25 — Audio Explainer (With Applied Examples)</title>
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface2:#EEF1F8; --border:#DDE2EE; --border2:#C8CEDD;
  --accent:#2056C8; --accent-t:rgba(32,86,200,.08); --text:#1A1F35; --text2:#5B6585; --text3:#9AA0B8;
  --green:#1D9B6A; --radius:9px; --shadow:0 1px 3px rgba(26,31,53,.07), 0 4px 12px rgba(26,31,53,.04);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;padding:20px;}
.wrap{max-width:760px;margin:0 auto;}
h1{font-size:18px;font-weight:700;margin-bottom:4px;}
.sub{font-size:12px;color:var(--text3);margin-bottom:20px;}

/* Compact, non-frozen player bar: sits at the top of the flow once and
   scrolls away with the page, instead of sticking and covering content below it. */
#player{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;margin-bottom:16px;}
#now-playing{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:2px;}
#now-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;min-height:16px;}

.controls{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.ctrl-btn{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;transition:opacity .12s;}
.ctrl-btn:hover{opacity:.88;}
.ctrl-btn.secondary{background:var(--surface2);color:var(--text2);border:1px solid var(--border2);}
.ctrl-btn:disabled{opacity:.35;cursor:default;}
.rate-wrap{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);margin-left:auto;}
.rate-wrap select{border:1px solid var(--border2);border-radius:6px;padding:3px 6px;font-size:11px;font-family:inherit;background:var(--surface);color:var(--text);}

/* Single scrollable row instead of a wrapping grid — this is what made the
   bar tall enough to swallow the screen on narrower widths. */
#jumprow{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:5px;padding-bottom:3px;}
#jumprow::-webkit-scrollbar{height:4px;}
#jumprow::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.jbtn{flex:0 0 auto;width:26px;height:26px;border-radius:7px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .1s;}
.jbtn:hover{background:var(--surface2);}
.jbtn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.jbtn.done{border-color:var(--green);color:var(--green);}

#progress-line{font-size:10px;color:var(--text3);margin-top:6px;}

#edit-bar{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap;}
#edit-status{font-size:11px;color:var(--text3);}
#edit-status.err{color:#C0392B;font-weight:600;}
#edit-status.ok{color:var(--green);font-weight:600;}

.seg-text.editing,.ex-text.editing{outline:2px solid var(--accent);outline-offset:2px;background:var(--accent-t);cursor:text;}
.seg-text.dirty,.ex-text.dirty{border-left:3px solid #E8A33D;padding-left:8px;}
.edit-hint{font-size:10px;color:var(--accent);margin-top:4px;font-style:italic;}

#script{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.seg{padding:18px 22px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.seg:last-child{border-bottom:none;}
.seg:hover{background:var(--surface2);}
.seg.active{background:var(--accent-t);border-left:3px solid var(--accent);padding-left:19px;}
.seg-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--surface2);border:1px solid var(--border2);font-size:11px;font-weight:700;color:var(--text2);margin-right:8px;}
.seg.active .seg-num{background:var(--accent);border-color:var(--accent);color:#fff;}
.seg-title{display:inline;font-size:13.5px;font-weight:600;color:var(--text);}
.seg-text{margin-top:8px;font-size:13.5px;color:var(--text2);line-height:1.65;}
.ex-text{margin-top:8px;font-size:13.5px;color:var(--text);font-weight:600;background:var(--surface2);padding:10px;border-radius:6px;}

.hint{font-size:11px;color:var(--text3);text-align:center;margin-top:14px;}
</style>
</head>
<body>

<div class="wrap">
  <h1>Chapter 25 — Audio Explainer</h1>
  <div class="sub">Plain-language narration with strict engineering examples. Tap a number to jump straight to it.</div>

  <div id="player">
    <div id="now-playing">Up next</div>
    <div id="now-title">Diagram 1 — Who Regulates What</div>

    <div class="controls">
      <button class="ctrl-btn" id="btn-play">▶ Play</button>
      <button class="ctrl-btn secondary" id="btn-pause" disabled>⏸ Pause</button>
      <button class="ctrl-btn secondary" id="btn-stop" disabled>⏹ Stop</button>
      <div class="rate-wrap">
        <span>Speed</span>
        <select id="rate-select">
          <option value="0.8">0.8×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
        </select>
      </div>
    </div>

    <div id="jumprow"></div>
    <div id="progress-line">Diagram 1 of 5</div>

    <div id="edit-bar">
      <button class="ctrl-btn secondary" id="btn-enable-edit">📝 Enable Editing</button>
      <button class="ctrl-btn" id="btn-save-edit" style="display:none;">💾 Save to File</button>
      <span id="edit-status"></span>
    </div>
  </div>

  <div id="script"></div>

  <div class="hint">Uses your browser's built-in voice — no audio files, no internet required after the page loads.</div>
</div>

<script>
const SEGMENTS = [
  {
    title: "Diagram 1 — Who Regulates What (Federal vs Provincial Patchwork)",
    text: "Canada does not have one single organization that controls all investment and stock market rules. Instead, each province has its own securities regulator (a government organization that creates and enforces rules for buying, selling, and reporting information about investments). This creates a complicated system because every province can have slightly different rules. To make the rules more consistent, these provincial regulators work together through an organization called the Canadian Securities Administrators (CSA) (a group where all provincial and territorial securities regulators cooperate and create common guidelines). The CSA creates documents called National Instruments (national rule documents that provide the same standards across Canada). One example is NI 43-101 (a National Instrument that sets rules for how mining companies must report information about their mineral resources and mining projects). Even if a province has not officially added a specific National Instrument into its own laws, professionals may still need to follow it. The reason is that courts can use these documents as a standard for professional behavior (a reference point to decide what a reasonable and competent professional should have done). In other words, a court may ask: \"Would a careful and knowledgeable professional in this field have followed this national standard?\" If the answer is no, the professional may be considered negligent (not acting with the level of care expected from someone in that profession). Think of it like a driving example: imagine every province has slightly different driving rules, but all driving instructors across Canada agree that checking your blind spot before changing lanes is the safe standard. Even if one province does not write that exact sentence into its law, ignoring that safety practice could still be used as evidence that you were not driving responsibly. National Instruments work in a similar way for professionals.",
    ex: "You write a geological report in a province that never officially passed NI 43-101 into law. Your report is sloppy, investors lose money, and you get sued. The judge will pull out NI 43-101, point out that you failed to meet its national standards, and find you professionally negligent, even though it wasn't a strict local statute."
  },
  {
    title: "Diagram 2 — The Disclosure Timeline (It Never Actually Ends)",
    text: "People sometimes think that once a company prepares and gets approval for a big document called a prospectus (a prospectus is a document that gives investors important information about a company before they buy its shares), the company has finished its job of giving information to the public. This is wrong. The prospectus is only the beginning. Once a company becomes public (a public company is a company whose shares can be bought and sold by the public), it must follow something called continuous disclosure (continuous disclosure means the company must keep giving important information to investors on an ongoing basis). For example, if something important happens that could affect the company's value, this is called a material change (a material change is an important change that could reasonably affect an investor's decision to buy, sell, or keep the company's shares). The company must report these important changes, along with things like press releases (official announcements made by the company) and financial statements (reports showing the company's financial situation and results). The main idea is simple: a company cannot give investors old information and then stay silent. It must keep updating them so they are not making investment decisions based on outdated or misleading information.",
    ex: "Your tech company goes public and sells millions in shares. Three months later, your flagship robot prototype catches fire and the project is delayed by a year. You cannot just stay quiet and wait for the next annual report. You must instantly issue a press release disclosing this material failure, or you are committing securities fraud."
  },
  {
    title: "Diagram 3 — The Qualified Person Independence Chain",
    text: "To approve and officially sign a public technical report (a report that is shared with the public and contains important technical information), you must be a Qualified Person (QP) (a professional who has the required knowledge, experience, and authority to take responsibility for technical work). To become a QP, you usually need at least five years of directly related experience (work experience that is closely connected to the technical area of the report) and you must be in good standing with your professional association (your engineering or professional organization must recognize that you are following the rules and are allowed to practice). However, being a QP means more than just putting your signature on a document. You cannot simply rubber-stamp a report (approve something without carefully checking it, just because someone else prepared it or wants it approved). You must personally review the information and physically inspect the site (visit the actual location where the work, project, or data comes from) to make sure the report is accurate. You must also work independently (make decisions based on your own professional judgment, not because someone pressures you) and you cannot change your opinion just to satisfy the CEO (the highest manager of a company) or company executives (people who make important business decisions). The company executives may choose and hire the QP, but the QP is the person who carries the technical liability (legal responsibility for whether the technical information is correct and reliable). In simple words: the company can choose the person who signs the report, but the professional who signs it is personally responsible for making sure the report is truthful and technically correct.",
    ex: "You have twenty years of experience designing HVAC systems for office towers. A gold mining company asks you to be the QP for their new underground mine prospectus to save money. You must refuse. Your experience is not relevant to gold mining, and if you sign the report, you are committing professional fraud."
  },
  {
    title: "Diagram 4 — The Liability Source Matrix",
    text: "If your technical report has a mistake that bankrupts investors, you face a brutal matrix of liability. You can be sued under common law for negligence or misrepresentation, but you also face strict statutory liability under securities legislation. Do not try to save yourself by putting a sneaky disclaimer at the bottom saying 'I am not liable for errors.' Under securities law, statutory liability absolutely cannot be disclaimed away. The judge will tear your disclaimer to pieces. If your technical report (a professional report containing technical information, calculations, findings, or opinions) contains a serious mistake and that mistake causes investors to lose a lot of money, you could face different types of legal responsibility. First, investors may sue you under common law (general laws created by courts) for negligence (you did not use the reasonable care expected from a professional) or misrepresentation (you gave information that was false or misleading, and someone relied on it and lost money). You may also face statutory liability (legal responsibility created directly by a written law, called a statute) under securities legislation (laws that regulate investments and protect investors). The important point is that you cannot simply avoid this legal responsibility by putting a disclaimer (a statement saying you are not responsible) at the bottom of your report, such as, \"I am not liable for any errors.\" When securities law creates liability, that responsibility cannot simply be removed by an agreement or disclaimer. In other words, you cannot write, \"I'm not responsible,\" and make the law disappear. If the law says you are responsible, the disclaimer will not protect you.",
    ex: "You publish a faulty oil reserve estimate that accidentally overstates the oil by fifty percent. You put a huge disclaimer on page one saying 'estimates are not guaranteed and the engineer is not liable.' Investors buy the stock, the oil isn't there, and the stock crashes. Because securities law outlaws these disclaimers, the investors will successfully sue you for millions."
  },
  {
    title: "Diagram 5 — The Insider Trading Decision Tree",
    text: "Insider trading is not just about secretly buying stocks; it is about exactly what you say and when you say it. If you hold secret test results, you cannot tell anyone. Once the company officially announces the results on the news, you are allowed to talk about it, but you are strictly limited to the exact words the company published. Adding extra spin, winks, or enthusiastic tone about details that are not yet public instantly crosses back into illegal insider trading. Insider trading (a situation where someone uses secret company information to gain an unfair advantage when buying or selling stocks) is not only about secretly buying shares. It is also about sharing information and the timing of that information. For example, imagine you work at a company and you know the results of an important test before the public knows. You cannot tell other people this secret information so they can make investment decisions. Once the company officially announces (publicly shares the information through an official source, such as a news release) the test results, you can talk about them. However, you can only repeat the information that the company has already made public. You cannot add your own extra comments, hints, or suggestions about information that has not been released yet. Even saying things like \"The results are much better than expected\" or giving a special hint through your tone or behavior can reveal secret information and may become illegal insider trading (breaking the law by using or sharing non-public company information for financial benefit). The key idea is: before information is public, keep it completely private; after it becomes public, only share exactly what everyone else has access to.",
    ex: "Your firm issues a press release stating 'we found traces of lithium.' At a dinner party, your buddy asks if it's a good find. You wink and say, 'It is a massive, extremely profitable find, way better than the press release sounds.' Your buddy buys stock based on your enthusiasm. You just committed illegal insider trading by adding qualitative spin that was not in the official public disclosure."
  },
];
let currentIndex = 0;
let isPlaying = false;
let isPaused = false;
let utterance = null;

const jumprow = document.getElementById('jumprow');
const scriptBox = document.getElementById('script');
const nowTitle = document.getElementById('now-title');
const nowPlaying = document.getElementById('now-playing');
const progressLine = document.getElementById('progress-line');
const btnPlay = document.getElementById('btn-play');
const btnPause = document.getElementById('btn-pause');
const btnStop = document.getElementById('btn-stop');
const rateSelect = document.getElementById('rate-select');

SEGMENTS.forEach((seg, i) => {
  const jb = document.createElement('button');
  jb.className = 'jbtn';
  jb.textContent = i + 1;
  jb.title = seg.title;
  jb.onclick = () => jumpTo(i, true);
  jumprow.appendChild(jb);

  const block = document.createElement('div');
  block.className = 'seg';
  block.id = 'seg-' + i;
  
  block.innerHTML = `
    <span class="seg-num">${i+1}</span>
    <span class="seg-title">${seg.title.replace(/^Diagram \d+ — /,'')}</span>
    <div class="seg-text" data-idx="${i}" data-field="text">${seg.text}</div>
    <div class="ex-text"><strong class="ex-label">Example:</strong> <span class="ex-content" data-idx="${i}" data-field="ex">${seg.ex}</span></div>
  `;
  block.onclick = (e) => {
    if (editingEnabled) return;
    jumpTo(i, true);
  };
  scriptBox.appendChild(block);
});

function refreshUI() {
  document.querySelectorAll('.jbtn').forEach((b, i) => {
    b.classList.toggle('active', i === currentIndex && isPlaying);
    b.classList.toggle('done', i < currentIndex);
  });
  document.querySelectorAll('.seg').forEach((s, i) => {
    s.classList.toggle('active', i === currentIndex);
  });
  nowTitle.textContent = SEGMENTS[currentIndex].title;
  nowPlaying.textContent = isPlaying ? (isPaused ? 'Paused' : 'Now playing') : 'Up next';
  progressLine.textContent = `Diagram ${currentIndex + 1} of ${SEGMENTS.length}`;
  btnPlay.disabled = isPlaying && !isPaused;
  btnPause.disabled = !isPlaying || isPaused;
  btnStop.disabled = !isPlaying;
  if (isPlaying) {
    const el = document.getElementById('seg-' + currentIndex);
    if (el) el.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  }
}

function speakCurrent() {
  window.speechSynthesis.cancel();
  
  const fullAudioText = SEGMENTS[currentIndex].text + " " + SEGMENTS[currentIndex].ex;
  
  utterance = new SpeechSynthesisUtterance(fullAudioText);
  utterance.rate = parseFloat(rateSelect.value);
  utterance.onend = () => {
    if (currentIndex < SEGMENTS.length - 1) {
      currentIndex++;
      refreshUI();
      speakCurrent();
    } else {
      isPlaying = false;
      isPaused = false;
      refreshUI();
    }
  };
  isPlaying = true;
  isPaused = false;
  refreshUI();
  window.speechSynthesis.speak(utterance);
}

function jumpTo(i, autoplay) {
  currentIndex = i;
  window.speechSynthesis.cancel();
  isPlaying = false;
  isPaused = false;
  refreshUI();
  if (autoplay) speakCurrent();
}

btnPlay.onclick = () => {
  if (isPaused) {
    window.speechSynthesis.resume();
    isPaused = false;
    isPlaying = true;
    refreshUI();
  } else {
    speakCurrent();
  }
};
btnPause.onclick = () => {
  window.speechSynthesis.pause();
  isPaused = true;
  refreshUI();
};
btnStop.onclick = () => {
  window.speechSynthesis.cancel();
  isPlaying = false;
  isPaused = false;
  refreshUI();
};
rateSelect.onchange = () => {
  if (isPlaying) speakCurrent();
};

window.addEventListener('beforeunload', () => window.speechSynthesis.cancel());

refreshUI();

// --- INLINE EDITING + DIRECT FILE SAVE ---
// Lets you edit the text/example of any diagram right on this page and
// save the changes straight back into this .html file on disk.
let editingEnabled = false;
let fileHandle = null;
let dirtyFields = new Set(); // "idx-field" keys, e.g. "3-ex"

const btnEnableEdit = document.getElementById('btn-enable-edit');
const btnSaveEdit   = document.getElementById('btn-save-edit');
const editStatus    = document.getElementById('edit-status');

function setEditStatus(msg, cls) {
  editStatus.textContent = msg;
  editStatus.className = cls || '';
}

btnEnableEdit.onclick = async () => {
  if (!('showOpenFilePicker' in window)) {
    setEditStatus('Your browser doesn\'t support direct file saving (needs Chrome or Edge). Edit in a text editor instead.', 'err');
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'HTML files', accept: { 'text/html': ['.html'] } }],
      excludeAcceptAllOption: false,
      multiple: false
    });
    const expectedName = document.title.match(/Chapter (\d+)/);
    if (expectedName && !handle.name.toLowerCase().includes(`ch${expectedName[1]}_explainer`)) {
      const proceed = confirm(`You picked "${handle.name}", but this page is "${document.title}". Continue anyway?`);
      if (!proceed) return;
    }
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') {
      setEditStatus('Permission to edit was not granted.', 'err');
      return;
    }
    fileHandle = handle;
    editingEnabled = true;
    document.querySelectorAll('.seg-text, .ex-content').forEach(el => {
      el.contentEditable = 'true';
      el.classList.add('editing');
      el.addEventListener('input', () => {
        const key = el.dataset.idx + '-' + el.dataset.field;
        dirtyFields.add(key);
        (el.classList.contains('ex-content') ? el.parentElement : el).classList.add('dirty');
        btnSaveEdit.textContent = `💾 Save to File (${dirtyFields.size} unsaved)`;
      });
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) e.preventDefault();
      });
    });
    btnEnableEdit.style.display = 'none';
    btnSaveEdit.style.display = 'inline-flex';
    setEditStatus('Editing on — click any explanation or example to change it.', 'ok');
  } catch (err) {
    if (err.name !== 'AbortError') setEditStatus('Could not open file: ' + err.message, 'err');
  }
};

function toJSStringLiteral(raw) {
  const cleaned = raw.replace(/\s+/g, ' ').trim();
  return '"' + cleaned.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
}

btnSaveEdit.onclick = async () => {
  if (!fileHandle) return;
  if (dirtyFields.size === 0) {
    setEditStatus('Nothing to save — no changes made yet.', '');
    return;
  }
  try {
    setEditStatus('Saving…', '');

    const lines = ['const SEGMENTS = ['];
    document.querySelectorAll('.seg').forEach((block, i) => {
      const textEl = block.querySelector('.seg-text');
      const exEl   = block.querySelector('.ex-content');
      const title  = SEGMENTS[i].title;
      lines.push('  {');
      lines.push('    title: ' + toJSStringLiteral(title) + ',');
      lines.push('    text: ' + toJSStringLiteral(textEl.innerText) + ',');
      lines.push('    ex: ' + toJSStringLiteral(exEl.innerText));
      lines.push('  },');
    });
    lines.push('];');
    const newBlock = lines.join('\n') + '\n';

    const file = await fileHandle.getFile();
    const currentText = await file.text();
    const s = currentText.indexOf('const SEGMENTS = [');
    const e = currentText.indexOf('let currentIndex = 0;');
    if (s === -1 || e === -1) throw new Error('Could not locate the SEGMENTS block in the file — nothing was saved.');

    const newFileText = currentText.slice(0, s) + newBlock + currentText.slice(e);
    const writable = await fileHandle.createWritable();
    await writable.write(newFileText);
    await writable.close();

    document.querySelectorAll('.seg').forEach((block, i) => {
      SEGMENTS[i].text = block.querySelector('.seg-text').innerText.trim();
      SEGMENTS[i].ex   = block.querySelector('.ex-content').innerText.trim();
      block.querySelectorAll('.dirty').forEach(el => el.classList.remove('dirty'));
    });
    dirtyFields.clear();
    btnSaveEdit.textContent = '💾 Save to File';
    setEditStatus(`Saved — ${new Date().toLocaleTimeString()}. Refresh anytime to confirm.`, 'ok');
  } catch (err) {
    setEditStatus('Save failed: ' + err.message, 'err');
  }
};
// --- END INLINE EDITING ---

</script>
</body>
</html>
