<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter 19 — Audio Explainer (With Applied Examples)</title>
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface2:#EEF1F8; --border:#DDE2EE; --border2:#C8CEDD;
  --accent:#2056C8; --accent-t:rgba(32,86,200,.08); --text:#1A1F35; --text2:#5B6585; --text3:#9AA0B8;
  --green:#1D9B6A; --radius:9px; --shadow:0 1px 3px rgba(26,31,53,.07), 0 4px 12px rgba(26,31,53,.04);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;padding:20px;}
.wrap{max-width:760px;margin:0 auto;}
h1{font-size:18px;font-weight:700;margin-bottom:4px;}
.sub{font-size:12px;color:var(--text3);margin-bottom:20px;}

/* Compact, non-frozen player bar: sits at the top of the flow once and
   scrolls away with the page, instead of sticking and covering content below it. */
#player{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;margin-bottom:16px;}
#now-playing{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:2px;}
#now-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;min-height:16px;}

.controls{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.ctrl-btn{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;transition:opacity .12s;}
.ctrl-btn:hover{opacity:.88;}
.ctrl-btn.secondary{background:var(--surface2);color:var(--text2);border:1px solid var(--border2);}
.ctrl-btn:disabled{opacity:.35;cursor:default;}
.rate-wrap{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);margin-left:auto;}
.rate-wrap select{border:1px solid var(--border2);border-radius:6px;padding:3px 6px;font-size:11px;font-family:inherit;background:var(--surface);color:var(--text);}

/* Single scrollable row instead of a wrapping grid — this is what made the
   bar tall enough to swallow the screen on narrower widths. */
#jumprow{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:5px;padding-bottom:3px;}
#jumprow::-webkit-scrollbar{height:4px;}
#jumprow::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.jbtn{flex:0 0 auto;width:26px;height:26px;border-radius:7px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .1s;}
.jbtn:hover{background:var(--surface2);}
.jbtn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.jbtn.done{border-color:var(--green);color:var(--green);}

#progress-line{font-size:10px;color:var(--text3);margin-top:6px;}

#edit-bar{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap;}
#edit-status{font-size:11px;color:var(--text3);}
#edit-status.err{color:#C0392B;font-weight:600;}
#edit-status.ok{color:var(--green);font-weight:600;}

.seg-text.editing,.ex-text.editing{outline:2px solid var(--accent);outline-offset:2px;background:var(--accent-t);cursor:text;}
.seg-text.dirty,.ex-text.dirty{border-left:3px solid #E8A33D;padding-left:8px;}
.edit-hint{font-size:10px;color:var(--accent);margin-top:4px;font-style:italic;}

#script{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.seg{padding:18px 22px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.seg:last-child{border-bottom:none;}
.seg:hover{background:var(--surface2);}
.seg.active{background:var(--accent-t);border-left:3px solid var(--accent);padding-left:19px;}
.seg-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--surface2);border:1px solid var(--border2);font-size:11px;font-weight:700;color:var(--text2);margin-right:8px;}
.seg.active .seg-num{background:var(--accent);border-color:var(--accent);color:#fff;}
.seg-title{display:inline;font-size:13.5px;font-weight:600;color:var(--text);}
.seg-text{margin-top:8px;font-size:13.5px;color:var(--text2);line-height:1.65;}
.ex-text{margin-top:8px;font-size:13.5px;color:var(--text);font-weight:600;background:var(--surface2);padding:10px;border-radius:6px;}

.hint{font-size:11px;color:var(--text3);text-align:center;margin-top:14px;}
</style>
</head>
<body>

<div class="wrap">
  <h1>Chapter 19 — Audio Explainer</h1>
  <div class="sub">Plain-language narration with strict engineering examples. Tap a number to jump straight to it.</div>

  <div id="player">
    <div id="now-playing">Up next</div>
    <div id="now-title">Diagram 1 — The Critical Path & Float Dynamics</div>

    <div class="controls">
      <button class="ctrl-btn" id="btn-play">▶ Play</button>
      <button class="ctrl-btn secondary" id="btn-pause" disabled>⏸ Pause</button>
      <button class="ctrl-btn secondary" id="btn-stop" disabled>⏹ Stop</button>
      <div class="rate-wrap">
        <span>Speed</span>
        <select id="rate-select">
          <option value="0.8">0.8×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
        </select>
      </div>
    </div>

    <div id="jumprow"></div>
    <div id="progress-line">Diagram 1 of 5</div>

    <div id="edit-bar">
      <button class="ctrl-btn secondary" id="btn-enable-edit">📝 Enable Editing</button>
      <button class="ctrl-btn" id="btn-save-edit" style="display:none;">💾 Save to File</button>
      <span id="edit-status"></span>
    </div>
  </div>

  <div id="script"></div>

  <div class="hint">Uses your browser's built-in voice — no audio files, no internet required after the page loads.</div>
</div>

<script>
const SEGMENTS = [
  {
    title: "Diagram 1 — The Critical Path & Float Dynamics",
    text: "A delay does not automatically mean a project is late. To prove you need more time, the delay must hit the Critical Path, which is the exact sequence of tasks with zero extra time. If a task has 'Float', it can be delayed without pushing back the final deadline. The trap here is that if an owner delays a task with float, you won't get a deadline extension, but you are still legally entitled to demand money for the extra equipment or rental costs caused by sitting around. A delay (something takes longer than planned) does not automatically mean the whole project will finish late. To prove that you deserve more time (an extension to the project deadline), the delay must affect the Critical Path (the Critical Path is the chain of tasks that must be completed on time because any delay to one of them will delay the entire project. These tasks have no extra time available). Some tasks have Float (also called slack), which is extra time built into the schedule. This means those tasks can be delayed for a while without delaying the project's final completion date. A common exam trap is that if the owner (the person or company paying for the project) causes a delay to a task that has float, you usually will not receive a time extension because the overall project is still expected to finish on time. However, you may still have the right to ask for compensation (money to cover extra costs) if the delay caused you additional expenses, such as paying for rented equipment, machinery, or workers that had to wait and could not continue working.",
    ex: "You are building a school. The foundation is on the critical path, but planting the grass has 14 days of float. If the owner delays the grass by 5 days, the school still opens on time, so you get no schedule extension. However, you can still force the owner to pay for the 5 extra days you had to rent the landscaping tractors."
  },
  {
    title: "Diagram 2 — The Delay Liability Matrix",
    text: "Every delay falls into one of three strict legal buckets. First is Compensable delay, caused by the owner, where you get both extra time and financial reimbursement. Second is Excusable delay, like severe weather or strikes, where you get extra time but nobody pays anyone. Third is Contractor-caused delay, where you get zero time and zero money. If both the owner and the contractor cause independent delays at the exact same time, it is called a Concurrent delay. Courts usually rule that neither side gets damages because it is impossible to perfectly split the blame. In construction projects, a delay (a situation where the work takes longer than planned) is divided into three main categories. The first is compensable delay (a delay caused by the owner—the person or company that hired the contractor). In this case, the contractor usually gets extra time to finish the work and also receives money to cover extra costs caused by the delay. For example, if the owner changes the design and this makes the project take longer, the contractor may receive more time and extra payment. The second is excusable delay (a delay caused by something outside anyone's control, such as extreme weather, a strike, or a natural disaster). In this situation, the contractor usually receives more time to complete the project, but does not receive extra money because nobody is considered responsible for causing the delay. The third is contractor-caused delay (a delay caused by the contractor's own mistake or failure to properly manage the work). In this case, the contractor receives no extra time and no extra money and may even have to pay for the consequences of the delay. Sometimes, both the owner and the contractor cause delays at the same time. This is called concurrent delay (when two separate delays happen during the same period). For example, the owner is late providing drawings, but at the same time, the contractor is late ordering materials. Since both sides contributed to the delay, courts often decide that neither side receives money for the delay because it is too difficult to determine exactly who caused how much of the problem. Easy way to remember: Owner caused it → contractor gets time + money Nobody caused it → contractor gets time only Contractor caused it → contractor gets nothing Both caused it → usually nobody gets money",
    ex: "A hurricane shuts down your site for a week. That is an Excusable delay; you get an extra week to finish, but the owner doesn't pay your crew. But if the owner fails to deliver the design drawings for a week, that is a Compensable delay; you get an extra week, and the owner must pay the wages of your crew who sat around drinking coffee."
  },
  {
    title: "Diagram 3 — The Notice Requirement & The Doyle Case Trap",
    text: "The extra problems caused by a delay (a situation where something happens later than planned) are called an impact (the additional effects or consequences caused by that delay). For example, imagine a building owner delays your concrete work (pouring concrete). You originally planned to pour the concrete in the summer when the weather is warm and the work is cheap. Because of the delay, the work is moved to winter, where freezing temperatures make the job much harder and more expensive. The higher cost caused by moving the work into winter is called the impact of the delay. The Doyle Case refers to a court case involving a construction contract dispute. The important rule from the case is that when a contractor gives a fixed price for changed work, they must include all costs they reasonably expect, including possible delay-related costs. If the contractor leaves out those costs and later asks for extra payment, the court may refuse because the owner relied on the original price when making the decision. In simple terms, contractors must give a complete price estimate when they agree to a change. The Doyle Case created an important rule: if the owner (the person who hires you and owns the project) asks you to change the work, and you provide a firm quote (a fixed price that you promise will cover the work), you must include all costs you know or should expect, including possible delay impacts. If you forget to include the extra winter costs and later ask the owner to pay more, the court may say no. The reason is that your quote gave the owner the impression that the entire change would cost that amount. If the owner had known about the extra costs, they might have decided not to approve the change. Because your quote prevented the owner from making that choice, you lose the right to ask for those extra costs later.",
    ex: "The owner asks to move a retaining wall. You quote $10,000 for the concrete, but forget that the delay pushes the pour into December, requiring $5,000 in ground heaters. If you sign the $10,000 change order and try to bill the extra $5,000 later, the judge will deny it completely. You must put the heating costs in the original quote."
  },
  {
    title: "Diagram 4 — Constructive Acceleration",
    text: "When an excusable delay happens, you are supposed to get a time extension. But what if the owner illegally refuses the extension and threatens to fire you if you miss the original deadline? You are forced to spend a fortune on overtime and weekend crews to catch up. This is called Constructive Acceleration. Because the owner breached the contract by denying your valid extension, you are legally allowed to sue the owner to recover every single dollar you spent on that frantic overtime. Constructive Acceleration happens when a contractor (the person or company hired to do the construction work) is supposed to receive extra time because of a delay that was not their fault, but the owner refuses to give them that extra time. For example, imagine you are building a house and a major problem outside your control delays the project by two weeks. Under the contract, you should receive two extra weeks to finish. However, the owner refuses to give you the extra time and says, \"Finish by the original deadline or I'll fire you.\" Because you are afraid of losing the job, you are forced to work overtime, bring in extra workers, and work on weekends to finish on the original date. This situation is called Constructive Acceleration (it means you were not directly told to speed up, but the owner's refusal to give you the time you were entitled to forces you to speed up anyway). The owner's refusal can be a breach of contract (meaning the owner did not follow something they were legally required to do under the contract). Because of this, you may be able to recover your extra costs (get the money back) from the owner, such as overtime pay, weekend work, and extra workers that you needed because you were forced to finish faster. Simple example: If the contractor is entitled to a 2-week extension because of a delay outside their control, but the owner says, “No extension—finish on the original date,” and the contractor spends extra money to meet that date, that may be constructive acceleration. The contractor could potentially claim those extra acceleration costs from the owner, depending on the contract and applicable law.",
    ex: "A city strike delays your steel delivery by a month. You ask for a one-month extension. The developer screams 'No, hit the original deadline or I will sue you!' You hire three extra night-shift crews at triple the pay to catch up. After the building is done, you successfully sue the developer for all that night-shift money because they constructively forced you to accelerate."
  },
  {
    title: "Diagram 5 — The Burden of Proof (Total Cost vs. Measured Mile)",
    text: "Proving that you were delayed is easy, but proving the exact dollar amount it cost you is incredibly difficult. Contractors often try the Total Cost approach, where they just take their final horrific bank statement, subtract their original bid, and demand the owner pay the difference. Courts hate this lazy math because it assumes the contractor made zero mistakes. Instead, you must use the Measured Mile approach. You mathematically compare a period where your crew worked perfectly against the period where the owner delayed you, scientifically proving the exact financial impact. Showing that you were delayed (your work took longer than it was supposed to) is usually easy. The much harder part is proving how much money that delay actually cost you. For example, a contractor (the person or company hired to do the construction work) might use the Total Cost approach (a method where the contractor simply looks at the total amount they spent, subtracts the amount they originally expected to spend, and asks the owner to pay the difference). For example, if the contractor expected to spend $100,000 but ended up spending $150,000, they might say, \"The owner delayed me, so pay me the extra $50,000.\" Courts often dislike this method because the extra $50,000 might not all have been caused by the owner's delay—the contractor could have made mistakes, worked inefficiently, or had other problems. Instead, the contractor should use the Measured Mile approach (a method of comparing your normal work performance with your work performance during the delay). For example, if your crew (the workers doing the job) normally installed 100 units per day before the owner's delay, but could install only 60 units per day during the delay, you can compare these two periods to show how much the delay actually hurt your productivity and increased your costs. In simple terms, Total Cost says, \"I spent $50,000 extra, so give me $50,000.\" Measured Mile says, \"Here is exactly how my work changed because of the delay, and here is the extra cost caused by that change.\" Here’s a much easier example of the Measured Mile approach: Simple Example Imagine you own a small pizza shop. Normally, your worker can make 10 pizzas per hour. Then, construction work starts outside your shop, making it difficult for the worker to move around. During the construction, the worker can make only 6 pizzas per hour. So you compare: Before the delay: 10 pizzas/hour During the delay: 6 pizzas/hour Difference: 4 fewer pizzas/hour The Measured Mile approach says: “Look at how much work we could normally do, compare it with how much we could do during the delay, and calculate the extra cost or loss caused by the delay.” So instead of saying, “We lost money, so pay us,” you can say, “Here is exactly how our work became slower during the delay, and here is the cost of that slowdown.”",
    ex: "You bid $100,000 for a piping job but it costs $150,000. You cannot just demand $50,000 from the owner. Instead, using the Measured Mile, you prove that before the owner interfered, your crew installed 100 pipes a day. During the owner's delay, they could only install 40 a day. You use that exact 60-pipe drop in productivity to calculate and win your damages in court."
  },
];
let currentIndex = 0;
let isPlaying = false;
let isPaused = false;
let utterance = null;

const jumprow = document.getElementById('jumprow');
const scriptBox = document.getElementById('script');
const nowTitle = document.getElementById('now-title');
const nowPlaying = document.getElementById('now-playing');
const progressLine = document.getElementById('progress-line');
const btnPlay = document.getElementById('btn-play');
const btnPause = document.getElementById('btn-pause');
const btnStop = document.getElementById('btn-stop');
const rateSelect = document.getElementById('rate-select');

SEGMENTS.forEach((seg, i) => {
  const jb = document.createElement('button');
  jb.className = 'jbtn';
  jb.textContent = i + 1;
  jb.title = seg.title;
  jb.onclick = () => jumpTo(i, true);
  jumprow.appendChild(jb);

  const block = document.createElement('div');
  block.className = 'seg';
  block.id = 'seg-' + i;
  
  block.innerHTML = `
    <span class="seg-num">${i+1}</span>
    <span class="seg-title">${seg.title.replace(/^Diagram \d+ — /,'')}</span>
    <div class="seg-text" data-idx="${i}" data-field="text">${seg.text}</div>
    <div class="ex-text"><strong class="ex-label">Example:</strong> <span class="ex-content" data-idx="${i}" data-field="ex">${seg.ex}</span></div>
  `;
  block.onclick = (e) => {
    if (editingEnabled) return;
    jumpTo(i, true);
  };
  scriptBox.appendChild(block);
});

function refreshUI() {
  document.querySelectorAll('.jbtn').forEach((b, i) => {
    b.classList.toggle('active', i === currentIndex && isPlaying);
    b.classList.toggle('done', i < currentIndex);
  });
  document.querySelectorAll('.seg').forEach((s, i) => {
    s.classList.toggle('active', i === currentIndex);
  });
  nowTitle.textContent = SEGMENTS[currentIndex].title;
  nowPlaying.textContent = isPlaying ? (isPaused ? 'Paused' : 'Now playing') : 'Up next';
  progressLine.textContent = `Diagram ${currentIndex + 1} of ${SEGMENTS.length}`;
  btnPlay.disabled = isPlaying && !isPaused;
  btnPause.disabled = !isPlaying || isPaused;
  btnStop.disabled = !isPlaying;
  if (isPlaying) {
    const el = document.getElementById('seg-' + currentIndex);
    if (el) el.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  }
}

function speakCurrent() {
  window.speechSynthesis.cancel();
  
  const fullAudioText = SEGMENTS[currentIndex].text + " " + SEGMENTS[currentIndex].ex;
  
  utterance = new SpeechSynthesisUtterance(fullAudioText);
  utterance.rate = parseFloat(rateSelect.value);
  utterance.onend = () => {
    if (currentIndex < SEGMENTS.length - 1) {
      currentIndex++;
      refreshUI();
      speakCurrent();
    } else {
      isPlaying = false;
      isPaused = false;
      refreshUI();
    }
  };
  isPlaying = true;
  isPaused = false;
  refreshUI();
  window.speechSynthesis.speak(utterance);
}

function jumpTo(i, autoplay) {
  currentIndex = i;
  window.speechSynthesis.cancel();
  isPlaying = false;
  isPaused = false;
  refreshUI();
  if (autoplay) speakCurrent();
}

btnPlay.onclick = () => {
  if (isPaused) {
    window.speechSynthesis.resume();
    isPaused = false;
    isPlaying = true;
    refreshUI();
  } else {
    speakCurrent();
  }
};
btnPause.onclick = () => {
  window.speechSynthesis.pause();
  isPaused = true;
  refreshUI();
};
btnStop.onclick = () => {
  window.speechSynthesis.cancel();
  isPlaying = false;
  isPaused = false;
  refreshUI();
};
rateSelect.onchange = () => {
  if (isPlaying) speakCurrent();
};

window.addEventListener('beforeunload', () => window.speechSynthesis.cancel());

refreshUI();

// --- INLINE EDITING + DIRECT FILE SAVE ---
// Lets you edit the text/example of any diagram right on this page and
// save the changes straight back into this .html file on disk.
let editingEnabled = false;
let fileHandle = null;
let dirtyFields = new Set(); // "idx-field" keys, e.g. "3-ex"

const btnEnableEdit = document.getElementById('btn-enable-edit');
const btnSaveEdit   = document.getElementById('btn-save-edit');
const editStatus    = document.getElementById('edit-status');

function setEditStatus(msg, cls) {
  editStatus.textContent = msg;
  editStatus.className = cls || '';
}

btnEnableEdit.onclick = async () => {
  if (!('showOpenFilePicker' in window)) {
    setEditStatus('Your browser doesn\'t support direct file saving (needs Chrome or Edge). Edit in a text editor instead.', 'err');
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'HTML files', accept: { 'text/html': ['.html'] } }],
      excludeAcceptAllOption: false,
      multiple: false
    });
    const expectedName = document.title.match(/Chapter (\d+)/);
    if (expectedName && !handle.name.toLowerCase().includes(`ch${expectedName[1]}_explainer`)) {
      const proceed = confirm(`You picked "${handle.name}", but this page is "${document.title}". Continue anyway?`);
      if (!proceed) return;
    }
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') {
      setEditStatus('Permission to edit was not granted.', 'err');
      return;
    }
    fileHandle = handle;
    editingEnabled = true;
    document.querySelectorAll('.seg-text, .ex-content').forEach(el => {
      el.contentEditable = 'true';
      el.classList.add('editing');
      el.addEventListener('input', () => {
        const key = el.dataset.idx + '-' + el.dataset.field;
        dirtyFields.add(key);
        (el.classList.contains('ex-content') ? el.parentElement : el).classList.add('dirty');
        btnSaveEdit.textContent = `💾 Save to File (${dirtyFields.size} unsaved)`;
      });
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) e.preventDefault();
      });
    });
    btnEnableEdit.style.display = 'none';
    btnSaveEdit.style.display = 'inline-flex';
    setEditStatus('Editing on — click any explanation or example to change it.', 'ok');
  } catch (err) {
    if (err.name !== 'AbortError') setEditStatus('Could not open file: ' + err.message, 'err');
  }
};

function toJSStringLiteral(raw) {
  const cleaned = raw.replace(/\s+/g, ' ').trim();
  return '"' + cleaned.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
}

btnSaveEdit.onclick = async () => {
  if (!fileHandle) return;
  if (dirtyFields.size === 0) {
    setEditStatus('Nothing to save — no changes made yet.', '');
    return;
  }
  try {
    setEditStatus('Saving…', '');

    const lines = ['const SEGMENTS = ['];
    document.querySelectorAll('.seg').forEach((block, i) => {
      const textEl = block.querySelector('.seg-text');
      const exEl   = block.querySelector('.ex-content');
      const title  = SEGMENTS[i].title;
      lines.push('  {');
      lines.push('    title: ' + toJSStringLiteral(title) + ',');
      lines.push('    text: ' + toJSStringLiteral(textEl.innerText) + ',');
      lines.push('    ex: ' + toJSStringLiteral(exEl.innerText));
      lines.push('  },');
    });
    lines.push('];');
    const newBlock = lines.join('\n') + '\n';

    const file = await fileHandle.getFile();
    const currentText = await file.text();
    const s = currentText.indexOf('const SEGMENTS = [');
    const e = currentText.indexOf('let currentIndex = 0;');
    if (s === -1 || e === -1) throw new Error('Could not locate the SEGMENTS block in the file — nothing was saved.');

    const newFileText = currentText.slice(0, s) + newBlock + currentText.slice(e);
    const writable = await fileHandle.createWritable();
    await writable.write(newFileText);
    await writable.close();

    document.querySelectorAll('.seg').forEach((block, i) => {
      SEGMENTS[i].text = block.querySelector('.seg-text').innerText.trim();
      SEGMENTS[i].ex   = block.querySelector('.ex-content').innerText.trim();
      block.querySelectorAll('.dirty').forEach(el => el.classList.remove('dirty'));
    });
    dirtyFields.clear();
    btnSaveEdit.textContent = '💾 Save to File';
    setEditStatus(`Saved — ${new Date().toLocaleTimeString()}. Refresh anytime to confirm.`, 'ok');
  } catch (err) {
    setEditStatus('Save failed: ' + err.message, 'err');
  }
};
// --- END INLINE EDITING ---

</script>
</body>
</html>
