<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter 23 — Audio Explainer (With Applied Examples)</title>
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface2:#EEF1F8; --border:#DDE2EE; --border2:#C8CEDD;
  --accent:#2056C8; --accent-t:rgba(32,86,200,.08); --text:#1A1F35; --text2:#5B6585; --text3:#9AA0B8;
  --green:#1D9B6A; --radius:9px; --shadow:0 1px 3px rgba(26,31,53,.07), 0 4px 12px rgba(26,31,53,.04);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;padding:20px;}
.wrap{max-width:760px;margin:0 auto;}
h1{font-size:18px;font-weight:700;margin-bottom:4px;}
.sub{font-size:12px;color:var(--text3);margin-bottom:20px;}

/* Compact, non-frozen player bar: sits at the top of the flow once and
   scrolls away with the page, instead of sticking and covering content below it. */
#player{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;margin-bottom:16px;}
#now-playing{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:2px;}
#now-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;min-height:16px;}

.controls{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.ctrl-btn{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;transition:opacity .12s;}
.ctrl-btn:hover{opacity:.88;}
.ctrl-btn.secondary{background:var(--surface2);color:var(--text2);border:1px solid var(--border2);}
.ctrl-btn:disabled{opacity:.35;cursor:default;}
.rate-wrap{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);margin-left:auto;}
.rate-wrap select{border:1px solid var(--border2);border-radius:6px;padding:3px 6px;font-size:11px;font-family:inherit;background:var(--surface);color:var(--text);}

/* Single scrollable row instead of a wrapping grid — this is what made the
   bar tall enough to swallow the screen on narrower widths. */
#jumprow{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:5px;padding-bottom:3px;}
#jumprow::-webkit-scrollbar{height:4px;}
#jumprow::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.jbtn{flex:0 0 auto;width:26px;height:26px;border-radius:7px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .1s;}
.jbtn:hover{background:var(--surface2);}
.jbtn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.jbtn.done{border-color:var(--green);color:var(--green);}

#progress-line{font-size:10px;color:var(--text3);margin-top:6px;}

#edit-bar{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap;}
#edit-status{font-size:11px;color:var(--text3);}
#edit-status.err{color:#C0392B;font-weight:600;}
#edit-status.ok{color:var(--green);font-weight:600;}

.seg-text.editing,.ex-text.editing{outline:2px solid var(--accent);outline-offset:2px;background:var(--accent-t);cursor:text;}
.seg-text.dirty,.ex-text.dirty{border-left:3px solid #E8A33D;padding-left:8px;}
.edit-hint{font-size:10px;color:var(--accent);margin-top:4px;font-style:italic;}

#script{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.seg{padding:18px 22px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.seg:last-child{border-bottom:none;}
.seg:hover{background:var(--surface2);}
.seg.active{background:var(--accent-t);border-left:3px solid var(--accent);padding-left:19px;}
.seg-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--surface2);border:1px solid var(--border2);font-size:11px;font-weight:700;color:var(--text2);margin-right:8px;}
.seg.active .seg-num{background:var(--accent);border-color:var(--accent);color:#fff;}
.seg-title{display:inline;font-size:13.5px;font-weight:600;color:var(--text);}
.seg-text{margin-top:8px;font-size:13.5px;color:var(--text2);line-height:1.65;}
.ex-text{margin-top:8px;font-size:13.5px;color:var(--text);font-weight:600;background:var(--surface2);padding:10px;border-radius:6px;}

.hint{font-size:11px;color:var(--text3);text-align:center;margin-top:14px;}
</style>
</head>
<body>

<div class="wrap">
  <h1>Chapter 23 — Audio Explainer</h1>
  <div class="sub">Plain-language narration with strict engineering examples. Tap a number to jump straight to it.</div>

  <div id="player">
    <div id="now-playing">Up next</div>
    <div id="now-title">Diagram 1 — Environmental Jurisdiction</div>

    <div class="controls">
      <button class="ctrl-btn" id="btn-play">▶ Play</button>
      <button class="ctrl-btn secondary" id="btn-pause" disabled>⏸ Pause</button>
      <button class="ctrl-btn secondary" id="btn-stop" disabled>⏹ Stop</button>
      <div class="rate-wrap">
        <span>Speed</span>
        <select id="rate-select">
          <option value="0.8">0.8×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
        </select>
      </div>
    </div>

    <div id="jumprow"></div>
    <div id="progress-line">Diagram 1 of 5</div>

    <div id="edit-bar">
      <button class="ctrl-btn secondary" id="btn-enable-edit">📝 Enable Editing</button>
      <button class="ctrl-btn" id="btn-save-edit" style="display:none;">💾 Save to File</button>
      <span id="edit-status"></span>
    </div>
  </div>

  <div id="script"></div>

  <div class="hint">Uses your browser's built-in voice — no audio files, no internet required after the page loads.</div>
</div>

<script>
const SEGMENTS = [
  {
    title: "Diagram 1 — Environmental Jurisdiction (Federal vs. Provincial)",
    text: "Environmental law is a massive jurisdictional trap because both the federal and provincial governments control it simultaneously. The federal government uses sweeping laws like the Fisheries Act and CEPA to protect national waters and toxic substances. The provinces control the actual physical land, local emissions, and resource extraction. Because these powers overlap, a single spill can result in you being prosecuted by both levels of government at the same time. If a provincial law and a federal law directly conflict, the federal law always wins. Environmental law (laws that protect things like air, water, land, animals, and natural resources) can be confusing because both the federal government and provincial governments can make environmental laws at the same time. The federal government (the Government of Canada) uses laws such as the Fisheries Act (a federal law that protects fish and fish habitat) and CEPA (the Canadian Environmental Protection Act, a federal law that controls pollution and dangerous substances) to protect things that are important across Canada, such as fish, water, and toxic substances (harmful chemicals). The provincial government (for example, the Manitoba government) mainly controls things within the province, such as the physical land, local pollution and emissions (pollution released into the air or water), and resource extraction (taking resources such as oil, gas, minerals, or other materials from the ground). Because the federal and provincial powers can overlap (both governments can have legal power over the same situation), one environmental accident, such as an oil spill, could potentially break both a federal law and a provincial law. This means you could be prosecuted (taken to court and accused of breaking the law) by both governments for the same incident. Finally, if a valid federal law and a provincial law directly conflict (you cannot follow one without breaking the other), the federal law generally takes priority (the federal law is followed instead of the conflicting provincial law).",
    ex: "You build a provincial dam and accidentally release silt into a local river. The province might have approved your concrete plan, but the federal government will step in and arrest you under the Fisheries Act for destroying a fish habitat. You are punished by the federal law despite having a provincial permit."
  },
  {
    title: "Diagram 2 — The Strict Liability Trap and Due Diligence",
    text: "Environmental offenses are strictly liability offenses. This means the prosecutor does not have to prove you intentionally polluted; they just point at the spilled oil and you are guilty. Your only legal escape hatch is the Due Diligence defense. You must prove you took all reasonable, proactive steps to prevent the spill before it happened. The law draws a brutal line between action and inaction. Writing a safety manual and putting it on a shelf is useless inaction. You need proof of active training, constant auditing, and real enforcement. Environmental offenses (breaking a law that protects the environment) are often strict liability offenses (a type of offense where the prosecutor does not have to prove that you meant to do something wrong). For example, imagine your company accidentally spills oil into a river. The prosecutor (the lawyer who tries to prove that you broke the law) does not necessarily have to prove that you intended to pollute the river. They can simply prove that the oil spill happened and that you were legally responsible for it. However, you may have a Due Diligence defense (a legal defense where you show that you did everything reasonable to prevent the problem from happening). To use this defense, you need to show that before the spill happened, you took real and reasonable steps to prevent it. The law makes an important difference between action (actually doing something to prevent the problem) and inaction (not actually doing anything). For example, simply writing a safety manual and putting it on a shelf is inaction because nobody is actually using it. Instead, you should be able to show active training (actually teaching employees what to do), regular auditing (regularly checking whether safety rules are being followed), and real enforcement (actually taking action when employees do not follow the rules). In simple terms: you cannot just have safety rules written on paper—you need to prove that you actually used those rules to prevent the environmental problem.",
    ex: "A valve breaks at your chemical plant and leaks toxic sludge. You are charged. You show the judge maintenance logs proving you physically inspected that exact valve every Tuesday and trained the crew on emergency spill response just last week. The judge accepts your active due diligence and you are acquitted."
  },
  {
    title: "Diagram 3 — Environmental Site Assessments (The 3 Phases)",
    text: "Before buying commercial land, you must run an Environmental Site Assessment to ensure you are not buying a hidden toxic nightmare that you will be forced to clean up. Phase 1 is a pure paper hunt: you look at historical records to see if a gas station or dry cleaner used to be there. If Phase 1 raises red flags, you trigger Phase 2: you bring in a drill, take physical soil samples, and test for chemicals. If the dirt is confirmed toxic, you move to Phase 3: full physical remediation to dig up and clean the site. Before buying commercial land (land used for businesses, such as a shopping centre, factory, or gas station), you should do an Environmental Site Assessment (an investigation to find out whether the land is contaminated or polluted). This is important because you don't want to buy land with a hidden toxic problem (dangerous chemicals or pollution in the soil) and then become responsible for cleaning it up. Phase 1 is basically a paper investigation. You look at old records, maps, reports, and other information to find out what was previously done on the land. For example, you might discover that a gas station or dry cleaner (a business that uses chemicals to clean clothes) used to operate there. If Phase 1 finds something that looks suspicious, you move to Phase 2. Phase 2 is a physical investigation (you actually test the land instead of just looking at records). Experts may drill into the ground, take soil samples (small amounts of dirt taken from the ground), and test them for harmful chemicals. If the tests confirm that the soil is contaminated, you move to Phase 3. Phase 3 is remediation (cleaning up the contamination). This could mean digging up contaminated soil, removing it, and cleaning the site so it is safe to use.",
    ex: "You want to buy an empty parking lot to build a warehouse. Phase 1 reveals a chemical processing plant operated there in 1970. You do a Phase 2 drill and find severe groundwater contamination. You must now pay for a massive Phase 3 remediation to physically pump and filter the soil before you can pour a single foundation."
  },
  {
    title: "Diagram 4 — Environmental Audits",
    text: "An Environmental Audit is a voluntary internal check-up on an active, running business to see if they are breaking the law. It is split into two types. A Compliance Audit simply asks: 'Are we breaking any current pollution laws today?' A Management Audit asks: 'Do we have a good internal system to catch future problems?' The terrifying danger of an audit is that if it finds a leak, the government can legally subpoena your audit document and use it as evidence to prosecute you. An Environmental Audit (an environmental audit is a voluntary check-up of a business to see whether it is following environmental laws) is an internal check of a business while it is operating. In other words, the company looks at its own activities to find out whether it is causing pollution or breaking environmental rules. There are two main types. A Compliance Audit (a check to see whether the company is following the environmental laws that apply right now) asks a simple question: \"Are we breaking any environmental or pollution laws today?\" A Management Audit (a check of the company's internal rules, procedures, and systems) asks a different question: \"Do we have a good system in place to find and prevent environmental problems in the future?\" The important danger is that the audit report (the written document showing what the company found) may not always be protected from the government. If the audit finds something serious, such as an illegal chemical leak, the government may be able to subpoena the audit document (a subpoena is a legal order requiring someone to provide a document or information). The government could then use that document as evidence (information used to prove that someone broke the law) in a legal case or prosecution (a legal process where the government tries to prove that a person or company committed an offence).",
    ex: "You run a manufacturing plant and order an internal Compliance Audit. The auditor discovers pipe B is secretly leaking illegal amounts of sulfur. You are now legally required to report and fix this leak immediately. If you ignore it, the audit itself becomes a paper trail proving you knowingly hid the pollution, upgrading your charge from negligence to criminal intent."
  },
  {
    title: "Diagram 5 — The Duty to Report",
    text: "Environmental law enforces a brutal, non-negotiable duty to report spills. If you spill a dangerous amount of a toxic substance, the statute forces the person controlling the substance to call the government immediately. If you are an independent consulting engineer who spots a spill, you have a professional ethical duty to report it. You must first tell your client to report the spill. If the client refuses and tries to hide it, your duty to public safety instantly overrides your duty to the client, and you must report them yourself. Environmental law (laws that protect the environment, such as land, water, and air) creates a strict duty to report spills (a legal requirement to tell the government when a serious harmful substance is accidentally released). If you spill a dangerous amount of a toxic substance (a material that can harm people, animals, or the environment), the law requires the person controlling the substance (the person or company responsible for having or using it) to immediately report the spill to the government. If you are an independent consulting engineer (an engineer hired by a client to provide professional advice, rather than an employee of that client) and you notice a spill, you also have a professional ethical duty (a responsibility that comes from the rules and values of your profession) to make sure it is reported. First, you should tell your client (the person or company that hired you) that the spill must be reported. If the client refuses and tries to hide the spill, your duty to public safety (your responsibility to protect people and the environment) becomes more important than your duty to the client (your responsibility to serve and protect your client's interests). In that situation, you must report the spill yourself.",
    ex: "You are inspecting a client's site and see an underground diesel tank actively leaking into a public stream. You tell the client to report it. The client says, 'Keep your mouth shut, it will cost too much to clean.' Your ethical duty to the public activates immediately, and you must call the Ministry of Environment to report the leak, even if it gets your client heavily fined."
  },
];
let currentIndex = 0;
let isPlaying = false;
let isPaused = false;
let utterance = null;

const jumprow = document.getElementById('jumprow');
const scriptBox = document.getElementById('script');
const nowTitle = document.getElementById('now-title');
const nowPlaying = document.getElementById('now-playing');
const progressLine = document.getElementById('progress-line');
const btnPlay = document.getElementById('btn-play');
const btnPause = document.getElementById('btn-pause');
const btnStop = document.getElementById('btn-stop');
const rateSelect = document.getElementById('rate-select');

SEGMENTS.forEach((seg, i) => {
  const jb = document.createElement('button');
  jb.className = 'jbtn';
  jb.textContent = i + 1;
  jb.title = seg.title;
  jb.onclick = () => jumpTo(i, true);
  jumprow.appendChild(jb);

  const block = document.createElement('div');
  block.className = 'seg';
  block.id = 'seg-' + i;
  
  block.innerHTML = `
    <span class="seg-num">${i+1}</span>
    <span class="seg-title">${seg.title.replace(/^Diagram \d+ — /,'')}</span>
    <div class="seg-text" data-idx="${i}" data-field="text">${seg.text}</div>
    <div class="ex-text"><strong class="ex-label">Example:</strong> <span class="ex-content" data-idx="${i}" data-field="ex">${seg.ex}</span></div>
  `;
  block.onclick = (e) => {
    if (editingEnabled) return;
    jumpTo(i, true);
  };
  scriptBox.appendChild(block);
});

function refreshUI() {
  document.querySelectorAll('.jbtn').forEach((b, i) => {
    b.classList.toggle('active', i === currentIndex && isPlaying);
    b.classList.toggle('done', i < currentIndex);
  });
  document.querySelectorAll('.seg').forEach((s, i) => {
    s.classList.toggle('active', i === currentIndex);
  });
  nowTitle.textContent = SEGMENTS[currentIndex].title;
  nowPlaying.textContent = isPlaying ? (isPaused ? 'Paused' : 'Now playing') : 'Up next';
  progressLine.textContent = `Diagram ${currentIndex + 1} of ${SEGMENTS.length}`;
  btnPlay.disabled = isPlaying && !isPaused;
  btnPause.disabled = !isPlaying || isPaused;
  btnStop.disabled = !isPlaying;
  if (isPlaying) {
    const el = document.getElementById('seg-' + currentIndex);
    if (el) el.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  }
}

function speakCurrent() {
  window.speechSynthesis.cancel();
  
  const fullAudioText = SEGMENTS[currentIndex].text + " " + SEGMENTS[currentIndex].ex;
  
  utterance = new SpeechSynthesisUtterance(fullAudioText);
  utterance.rate = parseFloat(rateSelect.value);
  utterance.onend = () => {
    if (currentIndex < SEGMENTS.length - 1) {
      currentIndex++;
      refreshUI();
      speakCurrent();
    } else {
      isPlaying = false;
      isPaused = false;
      refreshUI();
    }
  };
  isPlaying = true;
  isPaused = false;
  refreshUI();
  window.speechSynthesis.speak(utterance);
}

function jumpTo(i, autoplay) {
  currentIndex = i;
  window.speechSynthesis.cancel();
  isPlaying = false;
  isPaused = false;
  refreshUI();
  if (autoplay) speakCurrent();
}

btnPlay.onclick = () => {
  if (isPaused) {
    window.speechSynthesis.resume();
    isPaused = false;
    isPlaying = true;
    refreshUI();
  } else {
    speakCurrent();
  }
};
btnPause.onclick = () => {
  window.speechSynthesis.pause();
  isPaused = true;
  refreshUI();
};
btnStop.onclick = () => {
  window.speechSynthesis.cancel();
  isPlaying = false;
  isPaused = false;
  refreshUI();
};
rateSelect.onchange = () => {
  if (isPlaying) speakCurrent();
};

window.addEventListener('beforeunload', () => window.speechSynthesis.cancel());

refreshUI();

// --- INLINE EDITING + DIRECT FILE SAVE ---
// Lets you edit the text/example of any diagram right on this page and
// save the changes straight back into this .html file on disk.
let editingEnabled = false;
let fileHandle = null;
let dirtyFields = new Set(); // "idx-field" keys, e.g. "3-ex"

const btnEnableEdit = document.getElementById('btn-enable-edit');
const btnSaveEdit   = document.getElementById('btn-save-edit');
const editStatus    = document.getElementById('edit-status');

function setEditStatus(msg, cls) {
  editStatus.textContent = msg;
  editStatus.className = cls || '';
}

btnEnableEdit.onclick = async () => {
  if (!('showOpenFilePicker' in window)) {
    setEditStatus('Your browser doesn\'t support direct file saving (needs Chrome or Edge). Edit in a text editor instead.', 'err');
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'HTML files', accept: { 'text/html': ['.html'] } }],
      excludeAcceptAllOption: false,
      multiple: false
    });
    const expectedName = document.title.match(/Chapter (\d+)/);
    if (expectedName && !handle.name.toLowerCase().includes(`ch${expectedName[1]}_explainer`)) {
      const proceed = confirm(`You picked "${handle.name}", but this page is "${document.title}". Continue anyway?`);
      if (!proceed) return;
    }
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') {
      setEditStatus('Permission to edit was not granted.', 'err');
      return;
    }
    fileHandle = handle;
    editingEnabled = true;
    document.querySelectorAll('.seg-text, .ex-content').forEach(el => {
      el.contentEditable = 'true';
      el.classList.add('editing');
      el.addEventListener('input', () => {
        const key = el.dataset.idx + '-' + el.dataset.field;
        dirtyFields.add(key);
        (el.classList.contains('ex-content') ? el.parentElement : el).classList.add('dirty');
        btnSaveEdit.textContent = `💾 Save to File (${dirtyFields.size} unsaved)`;
      });
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) e.preventDefault();
      });
    });
    btnEnableEdit.style.display = 'none';
    btnSaveEdit.style.display = 'inline-flex';
    setEditStatus('Editing on — click any explanation or example to change it.', 'ok');
  } catch (err) {
    if (err.name !== 'AbortError') setEditStatus('Could not open file: ' + err.message, 'err');
  }
};

function toJSStringLiteral(raw) {
  const cleaned = raw.replace(/\s+/g, ' ').trim();
  return '"' + cleaned.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
}

btnSaveEdit.onclick = async () => {
  if (!fileHandle) return;
  if (dirtyFields.size === 0) {
    setEditStatus('Nothing to save — no changes made yet.', '');
    return;
  }
  try {
    setEditStatus('Saving…', '');

    const lines = ['const SEGMENTS = ['];
    document.querySelectorAll('.seg').forEach((block, i) => {
      const textEl = block.querySelector('.seg-text');
      const exEl   = block.querySelector('.ex-content');
      const title  = SEGMENTS[i].title;
      lines.push('  {');
      lines.push('    title: ' + toJSStringLiteral(title) + ',');
      lines.push('    text: ' + toJSStringLiteral(textEl.innerText) + ',');
      lines.push('    ex: ' + toJSStringLiteral(exEl.innerText));
      lines.push('  },');
    });
    lines.push('];');
    const newBlock = lines.join('\n') + '\n';

    const file = await fileHandle.getFile();
    const currentText = await file.text();
    const s = currentText.indexOf('const SEGMENTS = [');
    const e = currentText.indexOf('let currentIndex = 0;');
    if (s === -1 || e === -1) throw new Error('Could not locate the SEGMENTS block in the file — nothing was saved.');

    const newFileText = currentText.slice(0, s) + newBlock + currentText.slice(e);
    const writable = await fileHandle.createWritable();
    await writable.write(newFileText);
    await writable.close();

    document.querySelectorAll('.seg').forEach((block, i) => {
      SEGMENTS[i].text = block.querySelector('.seg-text').innerText.trim();
      SEGMENTS[i].ex   = block.querySelector('.ex-content').innerText.trim();
      block.querySelectorAll('.dirty').forEach(el => el.classList.remove('dirty'));
    });
    dirtyFields.clear();
    btnSaveEdit.textContent = '💾 Save to File';
    setEditStatus(`Saved — ${new Date().toLocaleTimeString()}. Refresh anytime to confirm.`, 'ok');
  } catch (err) {
    setEditStatus('Save failed: ' + err.message, 'err');
  }
};
// --- END INLINE EDITING ---

</script>
</body>
</html>
