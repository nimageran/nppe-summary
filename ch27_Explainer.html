<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter 27 — Audio Explainer (With Applied Examples)</title>
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface2:#EEF1F8; --border:#DDE2EE; --border2:#C8CEDD;
  --accent:#2056C8; --accent-t:rgba(32,86,200,.08); --text:#1A1F35; --text2:#5B6585; --text3:#9AA0B8;
  --green:#1D9B6A; --radius:9px; --shadow:0 1px 3px rgba(26,31,53,.07), 0 4px 12px rgba(26,31,53,.04);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;padding:20px;}
.wrap{max-width:760px;margin:0 auto;}
h1{font-size:18px;font-weight:700;margin-bottom:4px;}
.sub{font-size:12px;color:var(--text3);margin-bottom:20px;}

/* Compact, non-frozen player bar: sits at the top of the flow once and
   scrolls away with the page, instead of sticking and covering content below it. */
#player{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;margin-bottom:16px;}
#now-playing{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:2px;}
#now-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;min-height:16px;}

.controls{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.ctrl-btn{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;transition:opacity .12s;}
.ctrl-btn:hover{opacity:.88;}
.ctrl-btn.secondary{background:var(--surface2);color:var(--text2);border:1px solid var(--border2);}
.ctrl-btn:disabled{opacity:.35;cursor:default;}
.rate-wrap{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);margin-left:auto;}
.rate-wrap select{border:1px solid var(--border2);border-radius:6px;padding:3px 6px;font-size:11px;font-family:inherit;background:var(--surface);color:var(--text);}

/* Single scrollable row instead of a wrapping grid — this is what made the
   bar tall enough to swallow the screen on narrower widths. */
#jumprow{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:5px;padding-bottom:3px;}
#jumprow::-webkit-scrollbar{height:4px;}
#jumprow::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.jbtn{flex:0 0 auto;width:26px;height:26px;border-radius:7px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .1s;}
.jbtn:hover{background:var(--surface2);}
.jbtn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.jbtn.done{border-color:var(--green);color:var(--green);}

#progress-line{font-size:10px;color:var(--text3);margin-top:6px;}

#edit-bar{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap;}
#edit-status{font-size:11px;color:var(--text3);}
#edit-status.err{color:#C0392B;font-weight:600;}
#edit-status.ok{color:var(--green);font-weight:600;}

.seg-text.editing,.ex-text.editing{outline:2px solid var(--accent);outline-offset:2px;background:var(--accent-t);cursor:text;}
.seg-text.dirty,.ex-text.dirty{border-left:3px solid #E8A33D;padding-left:8px;}
.edit-hint{font-size:10px;color:var(--accent);margin-top:4px;font-style:italic;}

#script{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.seg{padding:18px 22px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.seg:last-child{border-bottom:none;}
.seg:hover{background:var(--surface2);}
.seg.active{background:var(--accent-t);border-left:3px solid var(--accent);padding-left:19px;}
.seg-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--surface2);border:1px solid var(--border2);font-size:11px;font-weight:700;color:var(--text2);margin-right:8px;}
.seg.active .seg-num{background:var(--accent);border-color:var(--accent);color:#fff;}
.seg-title{display:inline;font-size:13.5px;font-weight:600;color:var(--text);}
.seg-text{margin-top:8px;font-size:13.5px;color:var(--text2);line-height:1.65;}
.ex-text{margin-top:8px;font-size:13.5px;color:var(--text);font-weight:600;background:var(--surface2);padding:10px;border-radius:6px;}

.hint{font-size:11px;color:var(--text3);text-align:center;margin-top:14px;}
</style>
</head>
<body>

<div class="wrap">
  <h1>Chapter 27 — Audio Explainer</h1>
  <div class="sub">Plain-language narration with strict engineering examples. Tap a number to jump straight to it.</div>

  <div id="player">
    <div id="now-playing">Up next</div>
    <div id="now-title">Diagram 1 — The Jurisdiction Cloud</div>

    <div class="controls">
      <button class="ctrl-btn" id="btn-play">▶ Play</button>
      <button class="ctrl-btn secondary" id="btn-pause" disabled>⏸ Pause</button>
      <button class="ctrl-btn secondary" id="btn-stop" disabled>⏹ Stop</button>
      <div class="rate-wrap">
        <span>Speed</span>
        <select id="rate-select">
          <option value="0.8">0.8×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
        </select>
      </div>
    </div>

    <div id="jumprow"></div>
    <div id="progress-line">Diagram 1 of 4</div>

    <div id="edit-bar">
      <button class="ctrl-btn secondary" id="btn-enable-edit">📝 Enable Editing</button>
      <button class="ctrl-btn" id="btn-save-edit" style="display:none;">💾 Save to File</button>
      <span id="edit-status"></span>
    </div>
  </div>

  <div id="script"></div>

  <div class="hint">Uses your browser's built-in voice — no audio files, no internet required after the page loads.</div>
</div>

<script>
const SEGMENTS = [
  {
    title: "Diagram 1 — The Jurisdiction Cloud (Where does Internet Law happen?)",
    text: "The internet does not remove the importance of countries' borders. In fact, it can create more legal problems between different countries. For example, imagine you have a website in Canada and you sell software (a computer program or digital product) to customers in Germany. You cannot automatically assume that only Canadian law (the rules created by Canada) applies to you. Courts use a legal idea called \"Real and Substantial Connection\" (a test used to decide whether a country has a strong enough connection to a person, business, or situation to apply its laws). A country may have the right to deal with your case if there is a meaningful connection between you and that country. The question is: \"Does this business have a meaningful connection with this country?\" For example, if your Canadian company only has a website that anyone in the world can visit, that alone may not always be enough. However, if you actively target customers in Germany (for example, advertising specifically to German people, offering prices in euros, or creating a German-language website), accept payments from German customers, or keep your computer servers in Germany, then Germany may have a strong connection to your business. Jurisdiction (the legal power of a court to make decisions about a person, company, or case) means that a court has the authority to hear a case and apply its laws. So, even if your business is physically located in Canada, you might still be sued (taken to court because someone claims you did something wrong) in another country if your online activities create a strong connection with that country. The simple idea is: The internet allows your business to reach people anywhere, but that also means the laws of those places may reach you too. A website is not only \"inside\" the country where it is created; if it reaches into another country, that country may have legal power over you.",
    ex: "You build a website selling custom CNC machine parts from your shop in Winnipeg. You deliberately run ads targeting buyers in Texas, and a factory in Dallas buys your parts. If the parts fail and destroy their assembly line, they don't have to come to Canada to sue you. Because you actively targeted Texas, a Texas judge has full jurisdiction to drag you into a Texas court and apply Texas law."
  },
  {
    title: "Diagram 2 — Tort Liability for Defamation (The Publisher vs. The Platform)",
    text: "If someone posts a lie that destroys a company's reputation, the law needs to know exactly who to sue. The original author is obviously strictly liable. If you actively review, edit, or curate the posts before they go live, you are a 'Publisher,' and you inherit 100 percent of the liability for that lie. But if you just provide the passive infrastructure—like an internet service provider or a completely unmoderated message board—you are an 'Innocent Disseminator.' You are legally immune because you are just the dumb pipe carrying the data. Imagine someone posts a lie online that seriously damages a company's reputation (reputation means what people generally think about a person or company). The law then needs to decide who is legally responsible for spreading that lie. The person who originally wrote the lie is responsible because they created the false information. This person is sometimes called the author (the person who originally wrote or created the statement). If another person or company actively reviews, edits, chooses, or checks what people post before it becomes public, they are called a publisher (a person or company that has some control over what information is published or made public). Because they had control over the content, they can also be held legally responsible (required by law to pay for the harm they caused) for the false statement. However, if a company simply provides the basic service that carries the information without checking or controlling what people post—for example, an internet service provider (ISP) (a company that gives you access to the internet) or a completely unmoderated message board (an online place where people can post messages without the website checking them first)—it may be considered an innocent disseminator (someone who simply passes information from one person to another without knowing about or controlling the false information). In that situation, the law may protect them from being held responsible because they did not create, review, or control the lie.",
    ex: "You set up an online forum for your customer service team to discuss machine Action Requests with clients. A frustrated client posts a total lie saying a rival supplier uses stolen, defective steel. If you just let the forum run automatically, you are an innocent disseminator and are safe. But if you actively read, approve, and edit the posts before they appear, you are a publisher. The rival supplier can sue you directly for defamation because you approved the lie."
  },
  {
    title: "Diagram 3 — The Electronic Signatures Equivalency Gate",
    text: "An electronic signature is legally just as powerful as wet ink on paper. Under federal and provincial electronic transaction acts, a clicked button, a typed name, or a digital biometric scan binds you to a contract perfectly. However, the system must definitively prove two things: your identity, meaning it was actually you at the keyboard, and your intent, meaning you deliberately agreed to the deal. But the law draws a hard line for highly sensitive documents. You cannot use an e-signature for wills, trusts, real estate land transfers, or personal guarantees. Those still require physical paper and ink. Absolutely, Nima. Here is the same paragraph, but with the difficult legal words explained right where they appear: An electronic signature (a signature you make digitally, such as typing your name, clicking \"I agree,\" or using your finger on a screen) can generally be legally valid (recognized by the law) just like a normal signature written with a pen on paper. Under electronic transaction laws (laws that explain when electronic documents and signatures are legally acceptable), clicking a button, typing your name, or using a biometric scan (using something unique about your body, such as your fingerprint or face) can show that you agreed to a contract. However, the system needs to be able to show two important things: your identity (proof that it was actually you who signed) and your intent (proof that you deliberately meant to agree to the contract). For example, if you accidentally click \"I agree,\" there may be a question about whether you actually intended to accept the deal. However, the law has special rules for some very important documents. An e-signature may not be enough for documents such as wills (instructions about what should happen to your property after you die), certain trusts (legal arrangements where someone holds or manages property for another person), land transfers (documents used to legally transfer ownership of land or a house), or some personal guarantees (a promise that you will personally pay someone else's debt if they don't pay). These documents can have special requirements, such as physical documents and handwritten signatures, depending on the applicable law.",
    ex: "You email a client a $50,000 quote for a new robotics arm, and they reply 'I approve.' That is a legally binding electronic signature because their email address proves identity and the text proves intent. But if you ask the client's CEO to personally guarantee the $50,000 loan with his own house, an email is totally useless. The law forces you to get the CEO's physical ink signature for a personal guarantee."
  },
  {
    title: "Diagram 4 — The Four Risks of Email (Why you need a Corporate Policy)",
    text: "Email can be one of the most risky tools in a workplace because it can create many problems if people use it carelessly. There are four main risks. First, carelessness (not being careful enough). People sometimes write things in emails—such as angry comments, jokes, or rude messages—that they would never write in an official document (a formal company document). However, an email can still become evidence (information that can be used to prove what someone said or did). Second, loss of control (losing the ability to control who sees the information). Once you send an email, the receiver can forward (send the same email to another person) it to many other people very quickly. A private message can suddenly become public. Third, authenticity (being sure that something is real and actually comes from the person it claims to come from). Emails can sometimes be fake. For example, someone can pretend to be your boss by creating a fake email address or pretending to send a message from your boss. Fourth, permanence (the fact that something can continue to exist for a very long time). Deleting an email from your computer does not always completely remove it. Copies may still exist on company backup systems (stored copies of information kept for safety). Because of these risks, companies need a Corporate Security Policy (a set of company rules that explains how employees should safely use computers, emails, and other digital tools). These rules help employees understand what they can send, what information they must protect, and how to avoid security problems.",
    ex: "You get angry at a supplier for sending bad Bill of Materials data, and you blast off a careless, insulting email calling them 'incompetent frauds.' You delete it from your sent folder to hide it. Two years later, your company is in a massive lawsuit with that supplier. Their lawyers legally demand the server backups, recover your deleted email perfectly, and project your angry, careless insult onto a screen in front of a judge."
  },
];
let currentIndex = 0;
let isPlaying = false;
let isPaused = false;
let utterance = null;

const jumprow = document.getElementById('jumprow');
const scriptBox = document.getElementById('script');
const nowTitle = document.getElementById('now-title');
const nowPlaying = document.getElementById('now-playing');
const progressLine = document.getElementById('progress-line');
const btnPlay = document.getElementById('btn-play');
const btnPause = document.getElementById('btn-pause');
const btnStop = document.getElementById('btn-stop');
const rateSelect = document.getElementById('rate-select');

SEGMENTS.forEach((seg, i) => {
  const jb = document.createElement('button');
  jb.className = 'jbtn';
  jb.textContent = i + 1;
  jb.title = seg.title;
  jb.onclick = () => jumpTo(i, true);
  jumprow.appendChild(jb);

  const block = document.createElement('div');
  block.className = 'seg';
  block.id = 'seg-' + i;
  
  block.innerHTML = `
    <span class="seg-num">${i+1}</span>
    <span class="seg-title">${seg.title.replace(/^Diagram \d+ — /,'')}</span>
    <div class="seg-text" data-idx="${i}" data-field="text">${seg.text}</div>
    <div class="ex-text"><strong class="ex-label">Example:</strong> <span class="ex-content" data-idx="${i}" data-field="ex">${seg.ex}</span></div>
  `;
  block.onclick = (e) => {
    if (editingEnabled) return;
    jumpTo(i, true);
  };
  scriptBox.appendChild(block);
});

function refreshUI() {
  document.querySelectorAll('.jbtn').forEach((b, i) => {
    b.classList.toggle('active', i === currentIndex && isPlaying);
    b.classList.toggle('done', i < currentIndex);
  });
  document.querySelectorAll('.seg').forEach((s, i) => {
    s.classList.toggle('active', i === currentIndex);
  });
  nowTitle.textContent = SEGMENTS[currentIndex].title;
  nowPlaying.textContent = isPlaying ? (isPaused ? 'Paused' : 'Now playing') : 'Up next';
  progressLine.textContent = `Diagram ${currentIndex + 1} of ${SEGMENTS.length}`;
  btnPlay.disabled = isPlaying && !isPaused;
  btnPause.disabled = !isPlaying || isPaused;
  btnStop.disabled = !isPlaying;
  if (isPlaying) {
    const el = document.getElementById('seg-' + currentIndex);
    if (el) el.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  }
}

function speakCurrent() {
  window.speechSynthesis.cancel();
  
  const fullAudioText = SEGMENTS[currentIndex].text + " " + SEGMENTS[currentIndex].ex;
  
  utterance = new SpeechSynthesisUtterance(fullAudioText);
  utterance.rate = parseFloat(rateSelect.value);
  utterance.onend = () => {
    if (currentIndex < SEGMENTS.length - 1) {
      currentIndex++;
      refreshUI();
      speakCurrent();
    } else {
      isPlaying = false;
      isPaused = false;
      refreshUI();
    }
  };
  isPlaying = true;
  isPaused = false;
  refreshUI();
  window.speechSynthesis.speak(utterance);
}

function jumpTo(i, autoplay) {
  currentIndex = i;
  window.speechSynthesis.cancel();
  isPlaying = false;
  isPaused = false;
  refreshUI();
  if (autoplay) speakCurrent();
}

btnPlay.onclick = () => {
  if (isPaused) {
    window.speechSynthesis.resume();
    isPaused = false;
    isPlaying = true;
    refreshUI();
  } else {
    speakCurrent();
  }
};
btnPause.onclick = () => {
  window.speechSynthesis.pause();
  isPaused = true;
  refreshUI();
};
btnStop.onclick = () => {
  window.speechSynthesis.cancel();
  isPlaying = false;
  isPaused = false;
  refreshUI();
};
rateSelect.onchange = () => {
  if (isPlaying) speakCurrent();
};

window.addEventListener('beforeunload', () => window.speechSynthesis.cancel());

refreshUI();

// --- INLINE EDITING + DIRECT FILE SAVE ---
// Lets you edit the text/example of any diagram right on this page and
// save the changes straight back into this .html file on disk.
let editingEnabled = false;
let fileHandle = null;
let dirtyFields = new Set(); // "idx-field" keys, e.g. "3-ex"

const btnEnableEdit = document.getElementById('btn-enable-edit');
const btnSaveEdit   = document.getElementById('btn-save-edit');
const editStatus    = document.getElementById('edit-status');

function setEditStatus(msg, cls) {
  editStatus.textContent = msg;
  editStatus.className = cls || '';
}

btnEnableEdit.onclick = async () => {
  if (!('showOpenFilePicker' in window)) {
    setEditStatus('Your browser doesn\'t support direct file saving (needs Chrome or Edge). Edit in a text editor instead.', 'err');
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'HTML files', accept: { 'text/html': ['.html'] } }],
      excludeAcceptAllOption: false,
      multiple: false
    });
    const expectedName = document.title.match(/Chapter (\d+)/);
    if (expectedName && !handle.name.toLowerCase().includes(`ch${expectedName[1]}_explainer`)) {
      const proceed = confirm(`You picked "${handle.name}", but this page is "${document.title}". Continue anyway?`);
      if (!proceed) return;
    }
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') {
      setEditStatus('Permission to edit was not granted.', 'err');
      return;
    }
    fileHandle = handle;
    editingEnabled = true;
    document.querySelectorAll('.seg-text, .ex-content').forEach(el => {
      el.contentEditable = 'true';
      el.classList.add('editing');
      el.addEventListener('input', () => {
        const key = el.dataset.idx + '-' + el.dataset.field;
        dirtyFields.add(key);
        (el.classList.contains('ex-content') ? el.parentElement : el).classList.add('dirty');
        btnSaveEdit.textContent = `💾 Save to File (${dirtyFields.size} unsaved)`;
      });
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) e.preventDefault();
      });
    });
    btnEnableEdit.style.display = 'none';
    btnSaveEdit.style.display = 'inline-flex';
    setEditStatus('Editing on — click any explanation or example to change it.', 'ok');
  } catch (err) {
    if (err.name !== 'AbortError') setEditStatus('Could not open file: ' + err.message, 'err');
  }
};

function toJSStringLiteral(raw) {
  const cleaned = raw.replace(/\s+/g, ' ').trim();
  return '"' + cleaned.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
}

btnSaveEdit.onclick = async () => {
  if (!fileHandle) return;
  if (dirtyFields.size === 0) {
    setEditStatus('Nothing to save — no changes made yet.', '');
    return;
  }
  try {
    setEditStatus('Saving…', '');

    const lines = ['const SEGMENTS = ['];
    document.querySelectorAll('.seg').forEach((block, i) => {
      const textEl = block.querySelector('.seg-text');
      const exEl   = block.querySelector('.ex-content');
      const title  = SEGMENTS[i].title;
      lines.push('  {');
      lines.push('    title: ' + toJSStringLiteral(title) + ',');
      lines.push('    text: ' + toJSStringLiteral(textEl.innerText) + ',');
      lines.push('    ex: ' + toJSStringLiteral(exEl.innerText));
      lines.push('  },');
    });
    lines.push('];');
    const newBlock = lines.join('\n') + '\n';

    const file = await fileHandle.getFile();
    const currentText = await file.text();
    const s = currentText.indexOf('const SEGMENTS = [');
    const e = currentText.indexOf('let currentIndex = 0;');
    if (s === -1 || e === -1) throw new Error('Could not locate the SEGMENTS block in the file — nothing was saved.');

    const newFileText = currentText.slice(0, s) + newBlock + currentText.slice(e);
    const writable = await fileHandle.createWritable();
    await writable.write(newFileText);
    await writable.close();

    document.querySelectorAll('.seg').forEach((block, i) => {
      SEGMENTS[i].text = block.querySelector('.seg-text').innerText.trim();
      SEGMENTS[i].ex   = block.querySelector('.ex-content').innerText.trim();
      block.querySelectorAll('.dirty').forEach(el => el.classList.remove('dirty'));
    });
    dirtyFields.clear();
    btnSaveEdit.textContent = '💾 Save to File';
    setEditStatus(`Saved — ${new Date().toLocaleTimeString()}. Refresh anytime to confirm.`, 'ok');
  } catch (err) {
    setEditStatus('Save failed: ' + err.message, 'err');
  }
};
// --- END INLINE EDITING ---

</script>
</body>
</html>
