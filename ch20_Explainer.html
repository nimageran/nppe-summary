<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter 20 — Audio Explainer (With Applied Examples)</title>
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface2:#EEF1F8; --border:#DDE2EE; --border2:#C8CEDD;
  --accent:#2056C8; --accent-t:rgba(32,86,200,.08); --text:#1A1F35; --text2:#5B6585; --text3:#9AA0B8;
  --green:#1D9B6A; --radius:9px; --shadow:0 1px 3px rgba(26,31,53,.07), 0 4px 12px rgba(26,31,53,.04);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;padding:20px;}
.wrap{max-width:760px;margin:0 auto;}
h1{font-size:18px;font-weight:700;margin-bottom:4px;}
.sub{font-size:12px;color:var(--text3);margin-bottom:20px;}

/* Compact, non-frozen player bar: sits at the top of the flow once and
   scrolls away with the page, instead of sticking and covering content below it. */
#player{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;margin-bottom:16px;}
#now-playing{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:2px;}
#now-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;min-height:16px;}

.controls{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.ctrl-btn{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;transition:opacity .12s;}
.ctrl-btn:hover{opacity:.88;}
.ctrl-btn.secondary{background:var(--surface2);color:var(--text2);border:1px solid var(--border2);}
.ctrl-btn:disabled{opacity:.35;cursor:default;}
.rate-wrap{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);margin-left:auto;}
.rate-wrap select{border:1px solid var(--border2);border-radius:6px;padding:3px 6px;font-size:11px;font-family:inherit;background:var(--surface);color:var(--text);}

/* Single scrollable row instead of a wrapping grid — this is what made the
   bar tall enough to swallow the screen on narrower widths. */
#jumprow{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:5px;padding-bottom:3px;}
#jumprow::-webkit-scrollbar{height:4px;}
#jumprow::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.jbtn{flex:0 0 auto;width:26px;height:26px;border-radius:7px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .1s;}
.jbtn:hover{background:var(--surface2);}
.jbtn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.jbtn.done{border-color:var(--green);color:var(--green);}

#progress-line{font-size:10px;color:var(--text3);margin-top:6px;}

#edit-bar{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap;}
#edit-status{font-size:11px;color:var(--text3);}
#edit-status.err{color:#C0392B;font-weight:600;}
#edit-status.ok{color:var(--green);font-weight:600;}

.seg-text.editing,.ex-text.editing{outline:2px solid var(--accent);outline-offset:2px;background:var(--accent-t);cursor:text;}
.seg-text.dirty,.ex-text.dirty{border-left:3px solid #E8A33D;padding-left:8px;}
.edit-hint{font-size:10px;color:var(--accent);margin-top:4px;font-style:italic;}

#script{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.seg{padding:18px 22px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.seg:last-child{border-bottom:none;}
.seg:hover{background:var(--surface2);}
.seg.active{background:var(--accent-t);border-left:3px solid var(--accent);padding-left:19px;}
.seg-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--surface2);border:1px solid var(--border2);font-size:11px;font-weight:700;color:var(--text2);margin-right:8px;}
.seg.active .seg-num{background:var(--accent);border-color:var(--accent);color:#fff;}
.seg-title{display:inline;font-size:13.5px;font-weight:600;color:var(--text);}
.seg-text{margin-top:8px;font-size:13.5px;color:var(--text2);line-height:1.65;}
.ex-text{margin-top:8px;font-size:13.5px;color:var(--text);font-weight:600;background:var(--surface2);padding:10px;border-radius:6px;}

.hint{font-size:11px;color:var(--text3);text-align:center;margin-top:14px;}
</style>
</head>
<body>

<div class="wrap">
  <h1>Chapter 20 — Audio Explainer</h1>
  <div class="sub">Plain-language narration with strict engineering examples. Tap a number to jump straight to it.</div>

  <div id="player">
    <div id="now-playing">Up next</div>
    <div id="now-title">Diagram 1 — Employment Law vs. Labour Law</div>

    <div class="controls">
      <button class="ctrl-btn" id="btn-play">▶ Play</button>
      <button class="ctrl-btn secondary" id="btn-pause" disabled>⏸ Pause</button>
      <button class="ctrl-btn secondary" id="btn-stop" disabled>⏹ Stop</button>
      <div class="rate-wrap">
        <span>Speed</span>
        <select id="rate-select">
          <option value="0.8">0.8×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
        </select>
      </div>
    </div>

    <div id="jumprow"></div>
    <div id="progress-line">Diagram 1 of 6</div>

    <div id="edit-bar">
      <button class="ctrl-btn secondary" id="btn-enable-edit">📝 Enable Editing</button>
      <button class="ctrl-btn" id="btn-save-edit" style="display:none;">💾 Save to File</button>
      <span id="edit-status"></span>
    </div>
  </div>

  <div id="script"></div>

  <div class="hint">Uses your browser's built-in voice — no audio files, no internet required after the page loads.</div>
</div>

<script>
const SEGMENTS = [
  {
    title: "Diagram 1 — Employment Law vs. Labour Law (The Agency Model)",
    text: "In a normal job, you bargain directly with your boss. The second a union forms, that relationship is completely destroyed. The union becomes your exclusive legal agent. Employment law ends, and Labour law takes over. The employer is legally banned from pulling you aside to negotiate a private deal, even if the deal is good for you. Every single discussion must go through the union. Here’s the same paragraph rewritten as if you have zero background in labour law: In a normal job, you can talk directly with your boss about your pay, working conditions, or other parts of your job. But when you join a union (a group of employees that works together to negotiate with the employer), things change. The union becomes your exclusive legal representative (meaning the union is now the official person/group that speaks and negotiates with your employer for you). This means your employer generally cannot make a separate private deal directly with you about things covered by the union agreement, even if the deal would be better for you. For example, your boss cannot simply pull you aside and say, \"I'll personally give you a $2/hour raise if you agree to this.\" The employer must deal with the union, because the union now represents the employees in these employment matters. This is why we say that once a union is recognized, labour law (the rules that control the relationship between employers, employees, and unions) takes over from the normal individual employer-employee relationship.",
    ex: "If you are an engineer in a union, and the CEO offers you a secret $10,000 bonus to work weekends to finish a project, accepting it or even negotiating it is illegal. The CEO must negotiate that bonus directly with your union representative."
  },
  {
    title: "Diagram 2 — The Worker Classification Spectrum",
    text: "The labor board strictly sorts you into buckets to see if you are allowed to unionize. True independent contractors cannot unionize because teaming up to demand higher wages is illegal price-fixing under anti-competition laws. Dependent contractors and regular employees can unionize. Managers are banned from the union because they discipline the workers, creating a conflict of interest. Most importantly, if you are a licensed professional, your duty to public safety legally overrides any union strike order. The labour board (the government organization that deals with workplace and union rules) first puts workers into different categories (groups) to decide whether they are allowed to unionize (join together with other workers to negotiate with their employer about things like wages, hours, and working conditions). True independent contractors (people who work for themselves and are genuinely running their own business, rather than working like regular employees) generally cannot unionize. This is because they are considered separate businesses, and if they join together to demand higher prices for their work, it can be treated as price-fixing (when separate businesses agree together on the prices they will charge), which can violate competition laws (laws designed to prevent businesses from unfairly controlling prices or reducing competition). Dependent contractors (people who technically work for themselves but depend heavily on one company for their income) and regular employees (people who work for an employer as part of that employer's business) can generally unionize. Managers (people who have the authority to direct or discipline other workers) are normally not allowed to join the same union as the workers they manage because they could have a conflict of interest (a situation where a person's job responsibilities could conflict with their personal interests). Finally, if you are a licensed professional (someone such as an engineer whose work is regulated by a professional organization), your duty to public safety (your legal responsibility to protect the public from harm) can come before your union's instructions. This means that if a union tells you to strike (stop working as part of a group protest) but following that order would put the public in danger, your responsibility to protect the public can override the union's order.",
    ex: "A union orders all engineers to walk off a dam construction site immediately for a strike. If walking away causes the dam to flood a town, your engineering code of ethics overrides the union. You must stay and secure the dam, even if the union threatens to punish you for crossing the picket line."
  },
  {
    title: "Diagram 3 — Union Security & The Rand Formula",
    text: "Unions need money to survive. When they negotiate a raise, everyone gets it. To stop people from taking the raise without paying for the work, the law uses the 'Rand Formula'. This forces you to pay union dues even if you refuse to officially join the union. In Canada, courts also allow 'Closed Shops', meaning you literally cannot be hired for the job unless you are already carrying a union membership card. Unions (a union is a group of workers who join together to negotiate better pay and working conditions) need money to operate. When a union negotiates a higher salary or other benefits for workers, everyone covered by the union's agreement gets those benefits, even people who did not officially join the union. To make things fair, the law uses something called the Rand Formula (a rule that says workers covered by the union's agreement must pay union dues, even if they choose not to become union members). For example, if a union negotiates a $3/hour raise for everyone, you cannot say, \"I didn't join the union, so I won't pay any dues,\" while still receiving the $3 raise. The Closed Shop is a different and stronger rule (a closed shop means an employer can require a person to already be a union member before hiring them). In other words, under a closed shop, you may not be allowed to get the job at all unless you are already a member of the union.",
    ex: "You get a job at a unionized factory. You hate unions and refuse to sign the membership card. Under the Rand Formula, you don't have to go to union meetings, but the factory will still automatically deduct 2 percent of your paycheck and give it to the union every month to pay for the collective bargaining they do for you."
  },
  {
    title: "Diagram 4 — Multi-Union Construction & Stoppages",
    text: "Construction sites are chaotic because they have dozens of rival unions working side-by-side. The biggest threat isn't a strike against the boss; it is a 'Jurisdictional Dispute' where two unions fight over who gets to do a specific task. Because one angry trade can shut down a billion-dollar site, the law makes it strictly illegal to strike over a jurisdictional dispute. The labour board steps in and decides who gets the work based on historical industry practice. Construction sites can have many different unions (a union is a group of workers that represents and protects workers in a particular trade or type of job) working at the same time. The problem is that sometimes two unions fight over who has the right to do a particular job. This is called a jurisdictional dispute (a jurisdictional dispute is a disagreement between two unions about which union's workers should perform a certain task). For example, an electrical union might say, \"Our electricians should install these cables,\" while another union says, \"No, our workers should do it.\" The important point is that the fight is not about money or wages and it is not necessarily against the employer—the two unions are fighting with each other over the work. Because a fight like this could stop the entire construction project, the law generally does not allow workers to go on strike because of a jurisdictional dispute. Instead, the labour board (a government body that deals with labour and union disputes) can step in and decide which union should get the work. When making its decision, the labour board may look at historical industry practice (what has normally been done in that type of construction work in the past). The union isn't necessarily saying, \"Make our workers do more work.\" It's more like saying, \"This particular type of work belongs to our members.\" For example, electricians might say, \"Installing this electrical equipment is electrical work, so our electricians should do it.\" Another union might respond, \"No, our members are qualified and our agreement covers that work.\" So they're negotiating or fighting over who gets the work, not necessarily how much work each employee has to do.",
    ex: "The plumbers union and the carpenters union both claim it is their exclusive right to install wooden pipe supports. Instead of dropping their tools and shutting down the entire site, they are legally forced to keep working while the labour board reviews past projects and declares which trade gets the task."
  },
  {
    title: "Diagram 5 — The 'Corporate Charade' Shield",
    text: "Employers constantly try to destroy unions by using corporate shell games. They will bankrupt a unionized company, buy the assets with a brand-new 'non-union' company name, and hire cheaper workers. The law crushes this using the 'Successor and Common Employer' rules. If the same key directors are secretly pulling the strings, or if you just bought the core business, the labour board pierces the corporate veil. They will brutally drag the old union contract and slap it right onto the new company. Sometimes an employer may try to get rid of a union (a union is a group of workers that joins together to protect their rights and negotiate with the employer). For example, imagine a company has a union and does not want to follow the union's rules anymore. The owner might close or bankrupt the old company (bankrupt means the company cannot pay its debts), then create a new company with a different name and buy the old company's equipment, building, customers, or other important parts of the business. The new company then says, \"We are a completely different company, so we don't have to deal with the union.\" The law can prevent this. Under the successor employer rule (a successor employer is a new company that takes over an existing business or an important part of it), the new company may have to take over the old company's union obligations. There is also the common employer rule (this means two companies may be treated as one employer when they are really controlled or operated together). For example, if the same people are secretly controlling both the old and new companies, the labour board (the government body that deals with workplace and union disputes) may decide that the new company is really continuing the old business. In simple terms, the company cannot just change its name or create a new company on paper to escape the union. If the law finds that the new company is really continuing the old business, the old union agreement (the contract between the union and the employer) can continue to apply to the new company.",
    ex: "The directors of a unionized paving company shut it down, lay everyone off, change the logo on the trucks to 'New Paving Inc.', and try to hire non-union workers. The labour board sees the same directors are in charge, declares it a 'corporate charade', and legally forces 'New Paving Inc.' to rehire the old union workers at the exact same high union wages."
  },
  {
    title: "Diagram 6 — Grievances, Layoffs, and Arbitrator Power",
    text: "In a normal job, the boss can fire you for absolutely no reason, as long as they pay you severance money. Under a collective agreement, this power is completely destroyed. The boss can only fire you for 'Just Cause', meaning proven, severe misconduct. If they just run out of money and need to do layoffs, they cannot pick their favorite workers; they are legally forced to lay off the newest people first. If they fire you illegally, a labour arbitrator has the god-like power to force the boss to give you your exact job back. In a normal job (a job where you are not protected by a union contract), the boss can usually fire you without having to prove that you did something seriously wrong, as long as they follow the rules about notice or severance pay (money the employer may have to give you when ending your job). But when you work under a collective agreement (a contract between a union and an employer that sets rules for workers), things are different. The boss usually cannot simply fire you whenever they want. They need Just Cause (a good and serious reason for firing you, such as serious misconduct or repeated serious problems at work). If the company runs out of money and needs to reduce the number of workers, this is called a layoff (the company temporarily or permanently removes some jobs because it does not have enough work or money). In that situation, the employer may have to follow seniority rules (rules based on how long each worker has worked there), meaning newer workers may have to be laid off before workers who have been there longer. If the employer breaks the collective agreement and fires someone illegally, a labour arbitrator (an independent person who decides whether the employer followed the union contract) can order the employer to reinstate the worker (give the worker their job back). So, unlike a normal job, a unionized worker may actually be able to get their exact job back if they were fired without a legally acceptable reason.",
    ex: "A factory manager hates a senior welder and fires him, offering him a $50,000 severance package to go away. In a normal non-union job, that is perfectly legal. But in a union, the arbitrator will refuse the severance, physically reinstate the welder back onto the factory floor the next day, and force the manager to pay him for the days he missed."
  },
];
let currentIndex = 0;
let isPlaying = false;
let isPaused = false;
let utterance = null;

const jumprow = document.getElementById('jumprow');
const scriptBox = document.getElementById('script');
const nowTitle = document.getElementById('now-title');
const nowPlaying = document.getElementById('now-playing');
const progressLine = document.getElementById('progress-line');
const btnPlay = document.getElementById('btn-play');
const btnPause = document.getElementById('btn-pause');
const btnStop = document.getElementById('btn-stop');
const rateSelect = document.getElementById('rate-select');

SEGMENTS.forEach((seg, i) => {
  const jb = document.createElement('button');
  jb.className = 'jbtn';
  jb.textContent = i + 1;
  jb.title = seg.title;
  jb.onclick = () => jumpTo(i, true);
  jumprow.appendChild(jb);

  const block = document.createElement('div');
  block.className = 'seg';
  block.id = 'seg-' + i;
  
  block.innerHTML = `
    <span class="seg-num">${i+1}</span>
    <span class="seg-title">${seg.title.replace(/^Diagram \d+ — /,'')}</span>
    <div class="seg-text" data-idx="${i}" data-field="text">${seg.text}</div>
    <div class="ex-text"><strong class="ex-label">Example:</strong> <span class="ex-content" data-idx="${i}" data-field="ex">${seg.ex}</span></div>
  `;
  block.onclick = (e) => {
    if (editingEnabled) return;
    jumpTo(i, true);
  };
  scriptBox.appendChild(block);
});

function refreshUI() {
  document.querySelectorAll('.jbtn').forEach((b, i) => {
    b.classList.toggle('active', i === currentIndex && isPlaying);
    b.classList.toggle('done', i < currentIndex);
  });
  document.querySelectorAll('.seg').forEach((s, i) => {
    s.classList.toggle('active', i === currentIndex);
  });
  nowTitle.textContent = SEGMENTS[currentIndex].title;
  nowPlaying.textContent = isPlaying ? (isPaused ? 'Paused' : 'Now playing') : 'Up next';
  progressLine.textContent = `Diagram ${currentIndex + 1} of ${SEGMENTS.length}`;
  btnPlay.disabled = isPlaying && !isPaused;
  btnPause.disabled = !isPlaying || isPaused;
  btnStop.disabled = !isPlaying;
  if (isPlaying) {
    const el = document.getElementById('seg-' + currentIndex);
    if (el) el.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  }
}

function speakCurrent() {
  window.speechSynthesis.cancel();
  
  const fullAudioText = SEGMENTS[currentIndex].text + " " + SEGMENTS[currentIndex].ex;
  
  utterance = new SpeechSynthesisUtterance(fullAudioText);
  utterance.rate = parseFloat(rateSelect.value);
  utterance.onend = () => {
    if (currentIndex < SEGMENTS.length - 1) {
      currentIndex++;
      refreshUI();
      speakCurrent();
    } else {
      isPlaying = false;
      isPaused = false;
      refreshUI();
    }
  };
  isPlaying = true;
  isPaused = false;
  refreshUI();
  window.speechSynthesis.speak(utterance);
}

function jumpTo(i, autoplay) {
  currentIndex = i;
  window.speechSynthesis.cancel();
  isPlaying = false;
  isPaused = false;
  refreshUI();
  if (autoplay) speakCurrent();
}

btnPlay.onclick = () => {
  if (isPaused) {
    window.speechSynthesis.resume();
    isPaused = false;
    isPlaying = true;
    refreshUI();
  } else {
    speakCurrent();
  }
};
btnPause.onclick = () => {
  window.speechSynthesis.pause();
  isPaused = true;
  refreshUI();
};
btnStop.onclick = () => {
  window.speechSynthesis.cancel();
  isPlaying = false;
  isPaused = false;
  refreshUI();
};
rateSelect.onchange = () => {
  if (isPlaying) speakCurrent();
};

window.addEventListener('beforeunload', () => window.speechSynthesis.cancel());

refreshUI();

// --- INLINE EDITING + DIRECT FILE SAVE ---
// Lets you edit the text/example of any diagram right on this page and
// save the changes straight back into this .html file on disk.
let editingEnabled = false;
let fileHandle = null;
let dirtyFields = new Set(); // "idx-field" keys, e.g. "3-ex"

const btnEnableEdit = document.getElementById('btn-enable-edit');
const btnSaveEdit   = document.getElementById('btn-save-edit');
const editStatus    = document.getElementById('edit-status');

function setEditStatus(msg, cls) {
  editStatus.textContent = msg;
  editStatus.className = cls || '';
}

btnEnableEdit.onclick = async () => {
  if (!('showOpenFilePicker' in window)) {
    setEditStatus('Your browser doesn\'t support direct file saving (needs Chrome or Edge). Edit in a text editor instead.', 'err');
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'HTML files', accept: { 'text/html': ['.html'] } }],
      excludeAcceptAllOption: false,
      multiple: false
    });
    const expectedName = document.title.match(/Chapter (\d+)/);
    if (expectedName && !handle.name.toLowerCase().includes(`ch${expectedName[1]}_explainer`)) {
      const proceed = confirm(`You picked "${handle.name}", but this page is "${document.title}". Continue anyway?`);
      if (!proceed) return;
    }
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') {
      setEditStatus('Permission to edit was not granted.', 'err');
      return;
    }
    fileHandle = handle;
    editingEnabled = true;
    document.querySelectorAll('.seg-text, .ex-content').forEach(el => {
      el.contentEditable = 'true';
      el.classList.add('editing');
      el.addEventListener('input', () => {
        const key = el.dataset.idx + '-' + el.dataset.field;
        dirtyFields.add(key);
        (el.classList.contains('ex-content') ? el.parentElement : el).classList.add('dirty');
        btnSaveEdit.textContent = `💾 Save to File (${dirtyFields.size} unsaved)`;
      });
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) e.preventDefault();
      });
    });
    btnEnableEdit.style.display = 'none';
    btnSaveEdit.style.display = 'inline-flex';
    setEditStatus('Editing on — click any explanation or example to change it.', 'ok');
  } catch (err) {
    if (err.name !== 'AbortError') setEditStatus('Could not open file: ' + err.message, 'err');
  }
};

function toJSStringLiteral(raw) {
  const cleaned = raw.replace(/\s+/g, ' ').trim();
  return '"' + cleaned.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
}

btnSaveEdit.onclick = async () => {
  if (!fileHandle) return;
  if (dirtyFields.size === 0) {
    setEditStatus('Nothing to save — no changes made yet.', '');
    return;
  }
  try {
    setEditStatus('Saving…', '');

    const lines = ['const SEGMENTS = ['];
    document.querySelectorAll('.seg').forEach((block, i) => {
      const textEl = block.querySelector('.seg-text');
      const exEl   = block.querySelector('.ex-content');
      const title  = SEGMENTS[i].title;
      lines.push('  {');
      lines.push('    title: ' + toJSStringLiteral(title) + ',');
      lines.push('    text: ' + toJSStringLiteral(textEl.innerText) + ',');
      lines.push('    ex: ' + toJSStringLiteral(exEl.innerText));
      lines.push('  },');
    });
    lines.push('];');
    const newBlock = lines.join('\n') + '\n';

    const file = await fileHandle.getFile();
    const currentText = await file.text();
    const s = currentText.indexOf('const SEGMENTS = [');
    const e = currentText.indexOf('let currentIndex = 0;');
    if (s === -1 || e === -1) throw new Error('Could not locate the SEGMENTS block in the file — nothing was saved.');

    const newFileText = currentText.slice(0, s) + newBlock + currentText.slice(e);
    const writable = await fileHandle.createWritable();
    await writable.write(newFileText);
    await writable.close();

    document.querySelectorAll('.seg').forEach((block, i) => {
      SEGMENTS[i].text = block.querySelector('.seg-text').innerText.trim();
      SEGMENTS[i].ex   = block.querySelector('.ex-content').innerText.trim();
      block.querySelectorAll('.dirty').forEach(el => el.classList.remove('dirty'));
    });
    dirtyFields.clear();
    btnSaveEdit.textContent = '💾 Save to File';
    setEditStatus(`Saved — ${new Date().toLocaleTimeString()}. Refresh anytime to confirm.`, 'ok');
  } catch (err) {
    setEditStatus('Save failed: ' + err.message, 'err');
  }
};
// --- END INLINE EDITING ---

</script>
</body>
</html>
