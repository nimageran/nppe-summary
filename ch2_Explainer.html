<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter 2 — Audio Explainer (With Applied Examples)</title>
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface2:#EEF1F8; --border:#DDE2EE; --border2:#C8CEDD;
  --accent:#2056C8; --accent-t:rgba(32,86,200,.08); --text:#1A1F35; --text2:#5B6585; --text3:#9AA0B8;
  --green:#1D9B6A; --radius:9px; --shadow:0 1px 3px rgba(26,31,53,.07), 0 4px 12px rgba(26,31,53,.04);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;padding:20px;}
.wrap{max-width:760px;margin:0 auto;}
h1{font-size:18px;font-weight:700;margin-bottom:4px;}
.sub{font-size:12px;color:var(--text3);margin-bottom:20px;}

/* Compact, non-frozen player bar: sits at the top of the flow once and
   scrolls away with the page, instead of sticking and covering content below it. */
#player{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;margin-bottom:16px;}
#now-playing{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:2px;}
#now-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;min-height:16px;}

.controls{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.ctrl-btn{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;transition:opacity .12s;}
.ctrl-btn:hover{opacity:.88;}
.ctrl-btn.secondary{background:var(--surface2);color:var(--text2);border:1px solid var(--border2);}
.ctrl-btn:disabled{opacity:.35;cursor:default;}
.rate-wrap{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);margin-left:auto;}
.rate-wrap select{border:1px solid var(--border2);border-radius:6px;padding:3px 6px;font-size:11px;font-family:inherit;background:var(--surface);color:var(--text);}

/* Single scrollable row instead of a wrapping grid — this is what made the
   bar tall enough to swallow the screen on narrower widths. */
#jumprow{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:5px;padding-bottom:3px;}
#jumprow::-webkit-scrollbar{height:4px;}
#jumprow::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.jbtn{flex:0 0 auto;width:26px;height:26px;border-radius:7px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .1s;}
.jbtn:hover{background:var(--surface2);}
.jbtn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.jbtn.done{border-color:var(--green);color:var(--green);}

#progress-line{font-size:10px;color:var(--text3);margin-top:6px;}

#edit-bar{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap;}
#edit-status{font-size:11px;color:var(--text3);}
#edit-status.err{color:#C0392B;font-weight:600;}
#edit-status.ok{color:var(--green);font-weight:600;}

.seg-text.editing,.ex-text.editing{outline:2px solid var(--accent);outline-offset:2px;background:var(--accent-t);cursor:text;}
.seg-text.dirty,.ex-text.dirty{border-left:3px solid #E8A33D;padding-left:8px;}
.edit-hint{font-size:10px;color:var(--accent);margin-top:4px;font-style:italic;}

#script{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.seg{padding:18px 22px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.seg:last-child{border-bottom:none;}
.seg:hover{background:var(--surface2);}
.seg.active{background:var(--accent-t);border-left:3px solid var(--accent);padding-left:19px;}
.seg-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--surface2);border:1px solid var(--border2);font-size:11px;font-weight:700;color:var(--text2);margin-right:8px;}
.seg.active .seg-num{background:var(--accent);border-color:var(--accent);color:#fff;}
.seg-title{display:inline;font-size:13.5px;font-weight:600;color:var(--text);}
.seg-text{margin-top:8px;font-size:13.5px;color:var(--text2);line-height:1.65;}
.ex-text{margin-top:8px;font-size:13.5px;color:var(--text);font-weight:600;background:var(--surface2);padding:10px;border-radius:6px;}

.hint{font-size:11px;color:var(--text3);text-align:center;margin-top:14px;}
</style>
</head>
<body>

<div class="wrap">
  <h1>Chapter 2 — Audio Explainer</h1>
  <div class="sub">Plain-language narration with strict engineering examples. Tap a number to jump straight to it.</div>

  <div id="player">
    <div id="now-playing">Up next</div>
    <div id="now-title">Diagram 1 — The Self-Regulation Bargain</div>

    <div class="controls">
      <button class="ctrl-btn" id="btn-play">▶ Play</button>
      <button class="ctrl-btn secondary" id="btn-pause" disabled>⏸ Pause</button>
      <button class="ctrl-btn secondary" id="btn-stop" disabled>⏹ Stop</button>
      <div class="rate-wrap">
        <span>Speed</span>
        <select id="rate-select">
          <option value="0.8">0.8×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
        </select>
      </div>
    </div>

    <div id="jumprow"></div>
    <div id="progress-line">Diagram 1 of 6</div>

    <div id="edit-bar">
      <button class="ctrl-btn secondary" id="btn-enable-edit">📝 Enable Editing</button>
      <button class="ctrl-btn" id="btn-save-edit" style="display:none;">💾 Save to File</button>
      <span id="edit-status"></span>
    </div>
  </div>

  <div id="script"></div>

  <div class="hint">Uses your browser's built-in voice — no audio files, no internet required after the page loads.</div>
</div>

<script>
const SEGMENTS = [
  {
    title: "Diagram 1 — The Self-Regulation Bargain",
    text: "Engineering is a self-regulated profession. This means the government makes a trade with the engineering association. The government gives the association a powerful monopoly, allowing them to control exactly who gets to work and what titles they can use. In exchange, the association promises to use that monopoly to protect the public, not to protect the engineers. The association is not a union; it exists strictly to guard the public from bad engineering, not to get you a raise. Engineering is a self-regulated profession (this means engineers are mainly supervised by their own professional engineering association, rather than by the government directly). Think of it as a deal between the government (the people who make and enforce laws) and the engineering association (the organization that licenses engineers and makes sure they follow the rules). The government gives the engineering association a monopoly (the exclusive legal right to control something, meaning no other organization can decide who is allowed to become a licensed engineer or use protected engineering titles like \"Professional Engineer\" or \"P.Eng.\"). In return, the engineering association promises to use this special power to protect the public (make sure bridges, buildings, machines, and other engineering work are safe and done properly), not to protect engineers. In other words, the association's main job is to keep the public safe, even if that sometimes means disciplining or taking away the license of an engineer who breaks the rules. The engineering association is not a union (a union is an organization that fights for better pay, benefits, and working conditions for its members). Instead, its only purpose is to make sure engineers are competent, ethical, and do work that keeps the public safe.",
    ex: "If the government thinks the provincial engineering association is just trying to protect engineers' salaries or cover up bad designs instead of stopping buildings from collapsing, the government will rip up the deal, strip away their monopoly, and regulate the profession themselves."
  },
  {
    title: "Diagram 2 — Right to Title vs Right to Practice",
    text: "The law protects the profession using two completely different shields. Right to Title means only registered members can legally call themselves an 'Engineer.' Right to Practice means only registered members are legally allowed to do the actual physical work of engineering. Engineering and architecture always have both of these protections. Geoscience is tricky; depending on the specific province you are in, they might only have the Right to Title, meaning anyone can do the geology work as long as they don't call themselves a geoscientist. The law protects engineering and similar professions in two different ways. The first is called the Right to Title (a title is the official name someone is allowed to use for their profession, such as \"Engineer\"). This means that only people who are registered members (people who have met the legal requirements and been officially approved by the professional regulator) can legally call themselves an Engineer. The second is called the Right to Practice (practice means doing the actual work or job of that profession). This means that only registered members are legally allowed to perform engineering work. In Canada, engineering and architecture (the profession of designing buildings) are protected by both the Right to Title and the Right to Practice. Geoscience (the profession that studies the Earth, such as rocks, soil, and groundwater) is different. Depending on the province (one of Canada's regional governments, such as Manitoba or Ontario), geoscientists may only have the Right to Title. In those provinces, anyone can legally do geology-related work, as long as they do not call themselves a Geoscientist (the protected professional title).",
    ex: "You graduate with a mechanical engineering degree but haven't passed the licensing board yet. You decide to print 'P.Eng.' on your business card. You are illegally violating the Right to Title, and you will be prosecuted, even if you never actually design a single machine."
  },
  {
    title: "Diagram 3 — The Licensing Gauntlet",
    text: "To become a licensed professional engineer, you must pass five important requirements (requirements are things you must complete or prove before you are allowed to get something). Think of them like five locked doors that you must open one by one. First, you need the correct education (your engineering degree or academic background must meet the required standard). Second, you need enough engineering experience (real work experience where you practice engineering). Usually, this means four years of acceptable experience, and often at least one year must be in Canada so you understand Canadian engineering practices and rules. Third, you must prove your language ability (show that you can communicate well in English or French, which are Canada's official languages). Fourth, you must pass the good character requirement (prove that you are honest, responsible, and behave professionally). Finally, you must pass the NPPE (National Professional Practice Examination) (an exam that tests your knowledge of engineering law, ethics, and professional responsibilities). You must pass all five requirements. If you fail even one of them, you cannot receive your engineering license.",
    ex: "You have a PhD in engineering and ten years of brilliant design experience in Europe. You pass the academics and the exams perfectly. But if you lied on your application form about a past criminal fraud charge, you instantly fail the Good Character gate and will be permanently denied a license."
  },
  {
    title: "Diagram 4 — Discipline vs Enforcement",
    text: "The association uses two totally different weapons depending on who is breaking the rules. 'Discipline' is the weapon used against licensed members who are already inside the tent. If a licensed engineer is negligent, they get disciplined internally. 'Enforcement' is the weapon used against unlicensed outsiders who are trespassing. If a random person off the street tries to design a bridge, the association uses enforcement to drag them into a real public court and stop them. The engineering association (the association is the organization that regulates engineers and makes sure they follow the rules) has two different ways of dealing with people who break those rules, depending on who the person is. The first is called discipline (discipline means the association investigates and punishes one of its own licensed members if they break the rules). This applies to licensed members (people who have an official engineering licence and are legally allowed to practise engineering). For example, if a licensed engineer is negligent (negligent means they were careless and did not do their work with the level of care that was expected), the association can discipline that engineer. The second is called enforcement (enforcement means the association takes legal action against someone who is not a licensed engineer but is illegally doing engineering work). This applies to unlicensed people (people who do not have an engineering licence). For example, if someone without a licence tries to design a bridge, the association can ask a court (the government's legal system that decides legal disputes) to order that person to stop. In short, discipline is used for licensed engineers who are already members of the association, while enforcement is used for people outside the association who are breaking the law by practising engineering without a licence.",
    ex: "If you are a licensed P.Eng and you carelessly design a faulty retaining wall, you face Discipline, and the association suspends your license. If your unlicensed neighbor tries to sell retaining wall designs on Facebook, the association uses Enforcement to get a judge to issue an injunction against him."
  },
  {
    title: "Diagram 5 — The Disciplinary Process Pipeline",
    text: "When someone complains about an engineer, it triggers a strict pipeline. First, the association investigates. They gather evidence and decide if the complaint is real or just frivolous. If it is real, it goes to a Disciplinary Hearing. This is not a casual meeting in a boardroom; it is a brutal, formal legal trial where you can cross-examine witnesses and use lawyers. If you lose, they can fine you, suspend you, or strip your license completely. When someone makes a complaint (a formal report saying an engineer may have done something wrong) about an engineer, a formal process begins. First, the engineering association (the organization that regulates engineers and makes sure they follow professional rules) investigates the complaint. During the investigation, they gather evidence (information such as documents, emails, photos, or witness statements that help determine what happened) and decide whether the complaint is valid (supported by facts) or frivolous (not serious or lacking enough evidence). If they find that the complaint has enough evidence to continue, it moves to a Disciplinary Hearing (an official legal-like hearing where the engineer's conduct is reviewed). This is not just an informal meeting. It is a formal proceeding where both sides can present evidence, question or cross-examine witnesses (ask questions to people who are giving evidence to test whether their testimony is accurate), and be represented by lawyers (legal professionals who give advice and speak for a person during legal proceedings). If the engineer is found to have broken the professional rules, the association may impose disciplinary penalties (official punishments), such as a fine (a monetary penalty), suspending their licence (temporarily taking away their legal permission to practice engineering), or revoking their licence (permanently taking away their legal permission to practice engineering).",
    ex: "A client complains that your structural design was dangerously flawed. The investigative committee looks at the math and agrees it looks bad. They send you to a formal hearing. At the hearing, the prosecutor proves your math was completely negligent, and the panel officially revokes your engineering license."
  },
  {
    title: "Diagram 6 — The Three Meanings of the Seal",
    text: "Putting your professional seal (the official stamp that a licensed engineer uses to show that they are taking responsibility for a document) on a drawing is a very serious legal action. It means you are telling others, \"I am responsible for this work.\" By applying your seal, you are confirming that one of three things happened: you prepared the document yourself (you created and developed the drawing or design), you directly supervised the person who prepared it (you closely managed their work and made sure it was done correctly), or you carefully reviewed and checked the document (you examined the work in enough detail to make sure it meets professional standards). A common mistake is putting your seal on a document just because someone asks you to, because it is common practice, or because you feel pressured, without actually checking the work properly. This is dangerous because your seal is not just a signature—it is a legal promise (a statement that you accept responsibility under the law). Once you put your seal on a drawing, you become personally responsible (you can face legal consequences yourself) for the accuracy, safety, and quality of that document. In simple words: if your seal is on the page, the law sees it as your work and your responsibility.",
    ex: "A junior drafter hands you a complex piping diagram at 4:55 PM on a Friday. The client is screaming for it. You quickly stamp your seal on it without actually checking the pressure calculations. The pipe bursts. You are held entirely liable because your seal legally certified that you reviewed it, turning your lazy administrative rubber-stamp into professional negligence."
  },
];
let currentIndex = 0;
let isPlaying = false;
let isPaused = false;
let utterance = null;

const jumprow = document.getElementById('jumprow');
const scriptBox = document.getElementById('script');
const nowTitle = document.getElementById('now-title');
const nowPlaying = document.getElementById('now-playing');
const progressLine = document.getElementById('progress-line');
const btnPlay = document.getElementById('btn-play');
const btnPause = document.getElementById('btn-pause');
const btnStop = document.getElementById('btn-stop');
const rateSelect = document.getElementById('rate-select');

SEGMENTS.forEach((seg, i) => {
  const jb = document.createElement('button');
  jb.className = 'jbtn';
  jb.textContent = i + 1;
  jb.title = seg.title;
  jb.onclick = () => jumpTo(i, true);
  jumprow.appendChild(jb);

  const block = document.createElement('div');
  block.className = 'seg';
  block.id = 'seg-' + i;
  
  block.innerHTML = `
    <span class="seg-num">${i+1}</span>
    <span class="seg-title">${seg.title.replace(/^Diagram \d+ — /,'')}</span>
    <div class="seg-text" data-idx="${i}" data-field="text">${seg.text}</div>
    <div class="ex-text"><strong class="ex-label">Example:</strong> <span class="ex-content" data-idx="${i}" data-field="ex">${seg.ex}</span></div>
  `;
  block.onclick = (e) => {
    if (editingEnabled) return;
    jumpTo(i, true);
  };
  scriptBox.appendChild(block);
});

function refreshUI() {
  document.querySelectorAll('.jbtn').forEach((b, i) => {
    b.classList.toggle('active', i === currentIndex && isPlaying);
    b.classList.toggle('done', i < currentIndex);
  });
  document.querySelectorAll('.seg').forEach((s, i) => {
    s.classList.toggle('active', i === currentIndex);
  });
  nowTitle.textContent = SEGMENTS[currentIndex].title;
  nowPlaying.textContent = isPlaying ? (isPaused ? 'Paused' : 'Now playing') : 'Up next';
  progressLine.textContent = `Diagram ${currentIndex + 1} of ${SEGMENTS.length}`;
  btnPlay.disabled = isPlaying && !isPaused;
  btnPause.disabled = !isPlaying || isPaused;
  btnStop.disabled = !isPlaying;
  if (isPlaying) {
    const el = document.getElementById('seg-' + currentIndex);
    if (el) el.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  }
}

function speakCurrent() {
  window.speechSynthesis.cancel();
  
  const fullAudioText = SEGMENTS[currentIndex].text + " " + SEGMENTS[currentIndex].ex;
  
  utterance = new SpeechSynthesisUtterance(fullAudioText);
  utterance.rate = parseFloat(rateSelect.value);
  utterance.onend = () => {
    if (currentIndex < SEGMENTS.length - 1) {
      currentIndex++;
      refreshUI();
      speakCurrent();
    } else {
      isPlaying = false;
      isPaused = false;
      refreshUI();
    }
  };
  isPlaying = true;
  isPaused = false;
  refreshUI();
  window.speechSynthesis.speak(utterance);
}

function jumpTo(i, autoplay) {
  currentIndex = i;
  window.speechSynthesis.cancel();
  isPlaying = false;
  isPaused = false;
  refreshUI();
  if (autoplay) speakCurrent();
}

btnPlay.onclick = () => {
  if (isPaused) {
    window.speechSynthesis.resume();
    isPaused = false;
    isPlaying = true;
    refreshUI();
  } else {
    speakCurrent();
  }
};
btnPause.onclick = () => {
  window.speechSynthesis.pause();
  isPaused = true;
  refreshUI();
};
btnStop.onclick = () => {
  window.speechSynthesis.cancel();
  isPlaying = false;
  isPaused = false;
  refreshUI();
};
rateSelect.onchange = () => {
  if (isPlaying) speakCurrent();
};

window.addEventListener('beforeunload', () => window.speechSynthesis.cancel());

refreshUI();

// --- INLINE EDITING + DIRECT FILE SAVE ---
// Lets you edit the text/example of any diagram right on this page and
// save the changes straight back into this .html file on disk.
let editingEnabled = false;
let fileHandle = null;
let dirtyFields = new Set(); // "idx-field" keys, e.g. "3-ex"

const btnEnableEdit = document.getElementById('btn-enable-edit');
const btnSaveEdit   = document.getElementById('btn-save-edit');
const editStatus    = document.getElementById('edit-status');

function setEditStatus(msg, cls) {
  editStatus.textContent = msg;
  editStatus.className = cls || '';
}

btnEnableEdit.onclick = async () => {
  if (!('showOpenFilePicker' in window)) {
    setEditStatus('Your browser doesn\'t support direct file saving (needs Chrome or Edge). Edit in a text editor instead.', 'err');
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'HTML files', accept: { 'text/html': ['.html'] } }],
      excludeAcceptAllOption: false,
      multiple: false
    });
    const expectedName = document.title.match(/Chapter (\d+)/);
    if (expectedName && !handle.name.toLowerCase().includes(`ch${expectedName[1]}_explainer`)) {
      const proceed = confirm(`You picked "${handle.name}", but this page is "${document.title}". Continue anyway?`);
      if (!proceed) return;
    }
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') {
      setEditStatus('Permission to edit was not granted.', 'err');
      return;
    }
    fileHandle = handle;
    editingEnabled = true;
    document.querySelectorAll('.seg-text, .ex-content').forEach(el => {
      el.contentEditable = 'true';
      el.classList.add('editing');
      el.addEventListener('input', () => {
        const key = el.dataset.idx + '-' + el.dataset.field;
        dirtyFields.add(key);
        (el.classList.contains('ex-content') ? el.parentElement : el).classList.add('dirty');
        btnSaveEdit.textContent = `💾 Save to File (${dirtyFields.size} unsaved)`;
      });
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) e.preventDefault();
      });
    });
    btnEnableEdit.style.display = 'none';
    btnSaveEdit.style.display = 'inline-flex';
    setEditStatus('Editing on — click any explanation or example to change it.', 'ok');
  } catch (err) {
    if (err.name !== 'AbortError') setEditStatus('Could not open file: ' + err.message, 'err');
  }
};

function toJSStringLiteral(raw) {
  const cleaned = raw.replace(/\s+/g, ' ').trim();
  return '"' + cleaned.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
}

btnSaveEdit.onclick = async () => {
  if (!fileHandle) return;
  if (dirtyFields.size === 0) {
    setEditStatus('Nothing to save — no changes made yet.', '');
    return;
  }
  try {
    setEditStatus('Saving…', '');

    const lines = ['const SEGMENTS = ['];
    document.querySelectorAll('.seg').forEach((block, i) => {
      const textEl = block.querySelector('.seg-text');
      const exEl   = block.querySelector('.ex-content');
      const title  = SEGMENTS[i].title;
      lines.push('  {');
      lines.push('    title: ' + toJSStringLiteral(title) + ',');
      lines.push('    text: ' + toJSStringLiteral(textEl.innerText) + ',');
      lines.push('    ex: ' + toJSStringLiteral(exEl.innerText));
      lines.push('  },');
    });
    lines.push('];');
    const newBlock = lines.join('\n') + '\n';

    const file = await fileHandle.getFile();
    const currentText = await file.text();
    const s = currentText.indexOf('const SEGMENTS = [');
    const e = currentText.indexOf('let currentIndex = 0;');
    if (s === -1 || e === -1) throw new Error('Could not locate the SEGMENTS block in the file — nothing was saved.');

    const newFileText = currentText.slice(0, s) + newBlock + currentText.slice(e);
    const writable = await fileHandle.createWritable();
    await writable.write(newFileText);
    await writable.close();

    document.querySelectorAll('.seg').forEach((block, i) => {
      SEGMENTS[i].text = block.querySelector('.seg-text').innerText.trim();
      SEGMENTS[i].ex   = block.querySelector('.ex-content').innerText.trim();
      block.querySelectorAll('.dirty').forEach(el => el.classList.remove('dirty'));
    });
    dirtyFields.clear();
    btnSaveEdit.textContent = '💾 Save to File';
    setEditStatus(`Saved — ${new Date().toLocaleTimeString()}. Refresh anytime to confirm.`, 'ok');
  } catch (err) {
    setEditStatus('Save failed: ' + err.message, 'err');
  }
};
// --- END INLINE EDITING ---

</script>
</body>
</html>
