<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NPPE Audio Player</title>
<style>
  :root {
    --bg: #0e1320; --surface: #171e31; --surface2: #1e2740;
    --border: #29345a; --accent: #5b8cff; --accent2: #7aa2ff;
    --green: #3ecf8e; --text: #eef2fa; --text2: #b9c3da; --text3: #7c8ab0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: radial-gradient(1200px 600px at 20% -10%, #1a2340 0%, var(--bg) 55%);
    color: var(--text); min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    padding: 18px 14px 120px 14px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  header { margin: 6px 0 18px 0; }
  .kicker { font-size: 11px; font-weight: 800; letter-spacing: .16em;
            text-transform: uppercase; color: var(--accent2); }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin-top: 2px; }
  .sub { font-size: 12.5px; color: var(--text3); margin-top: 4px; }

  .panel { background: var(--surface); border: 1px solid var(--border);
           border-radius: 16px; padding: 14px; margin-bottom: 14px;
           box-shadow: 0 8px 30px rgba(0,0,0,.35); }

  label { display:block; font-size: 11px; font-weight: 700; letter-spacing:.08em;
          text-transform: uppercase; color: var(--text3); margin: 2px 0 6px 2px; }
  select {
    width: 100%; padding: 12px; border-radius: 12px; font-size: 15px;
    background: var(--surface2); color: var(--text);
    border: 1px solid var(--border); appearance: none; outline: none;
  }
  select:focus { border-color: var(--accent); }
  .row { display: flex; gap: 10px; } .row > div { flex: 1; }

  .btnrow { display: flex; gap: 10px; margin-top: 12px; }
  button {
    flex: 1; padding: 13px 8px; border-radius: 12px; font-size: 14px; font-weight: 700;
    border: 1px solid var(--border); background: var(--surface2); color: var(--text2);
    cursor: pointer; transition: all .12s; font-family: inherit;
  }
  button:active { transform: scale(.97); }
  button.primary { background: linear-gradient(135deg, var(--accent), #3f6fe8);
                   border: none; color: #fff; font-size: 16px; }
  button.playing { background: linear-gradient(135deg, var(--green), #27a06c);
                   border: none; color: #fff; }

  .card { background: linear-gradient(150deg, #1b2440, #161d33);
          border: 1px solid var(--border); border-radius: 16px;
          padding: 18px; margin-bottom: 14px; }
  .card .loc { font-size: 11px; font-weight: 800; letter-spacing: .12em;
               text-transform: uppercase; color: var(--accent2); }
  .card .title { font-size: 19px; font-weight: 800; margin: 6px 0 10px 0; line-height: 1.3; }
  .card .body { font-size: 14.5px; color: var(--text2); line-height: 1.75; }
  .card .ex { margin-top: 12px; padding: 12px 14px; border-radius: 10px;
              background: rgba(91,140,255,.10); border-left: 4px solid var(--accent);
              font-size: 14px; line-height: 1.7; color: var(--text); }
  .card .ex b { color: var(--accent2); }

  .toggles { display:flex; align-items:center; justify-content: space-between;
             gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .tg { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2); }
  .switch { position: relative; width: 44px; height: 25px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position:absolute; inset:0; background: var(--surface2);
            border:1px solid var(--border); border-radius: 25px; transition:.2s; }
  .slider:before { content:""; position:absolute; height:17px; width:17px; left:3px; top:3px;
                   background:var(--text3); border-radius:50%; transition:.2s; }
  .switch input:checked + .slider { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + .slider:before { transform: translateX(19px); background:#fff; }

  .speed { display:flex; align-items:center; gap:8px; font-size:13px; color: var(--text2); }
  .speed select { width:auto; padding:8px 10px; font-size:13px; }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: rgba(14,19,32,.92); backdrop-filter: blur(12px);
    border-top: 1px solid var(--border); padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
  }
  .bar-inner { max-width: 640px; margin: 0 auto; }
  #status { font-size: 12px; color: var(--text3); margin-bottom: 8px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .loading { text-align:center; color: var(--text3); padding: 40px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">NPPE · Practical Law</div>
    <h1>Audio Player</h1>
    <div class="sub" id="libinfo">Scanning for explainer files…</div>
  </header>

  <div class="panel">
    <div class="row">
      <div>
        <label>Chapter</label>
        <select id="chSel"></select>
      </div>
      <div>
        <label>Diagram</label>
        <select id="dgSel"></select>
      </div>
    </div>
    <div class="btnrow">
      <button id="randAll">🎲 Random anywhere</button>
      <button id="randCh">🎲 Random in chapter</button>
    </div>
    <div class="toggles">
      <div class="tg">
        <label class="switch" style="margin:0;">
          <input type="checkbox" id="autoNext" checked><span class="slider"></span>
        </label>
        Auto-continue
      </div>
      <div class="tg">
        <label class="switch" style="margin:0;">
          <input type="checkbox" id="shuffleMode"><span class="slider"></span>
        </label>
        Shuffle
      </div>
      <div class="speed">
        Speed
        <select id="rate">
          <option value="0.8">0.8×</option><option value="0.9">0.9×</option>
          <option value="1" selected>1×</option><option value="1.1">1.1×</option>
          <option value="1.25">1.25×</option><option value="1.5">1.5×</option>
        </select>
      </div>
    </div>
  </div>

  <div id="card" class="loading">Loading…</div>
</div>

<div class="bar"><div class="bar-inner">
  <div id="status">Ready.</div>
  <div class="btnrow" style="margin-top:0;">
    <button id="prev">⏮ Prev</button>
    <button id="play" class="primary">▶ Play</button>
    <button id="next">Next ⏭</button>
  </div>
</div></div>

<script>
const MAX_CH = 40; // scans ch1..ch40 so future chapters are picked up automatically
let LIB = {};      // { chNum: [ {num,title,text,ex}, ... ] }
let cur = { ch: null, i: 0 };
let playing = false, paused = false;

// ---------- load & parse every explainer in the folder ----------
function parseSegments(html) {
  const s = html.indexOf('const SEGMENTS = [');
  const e = html.indexOf('let currentIndex = 0;');
  if (s === -1 || e === -1) return [];
  const block = html.substring(s + 17, e).trim().replace(/;\s*$/, '');
  let arr = [];
  try { arr = new Function('return ' + block)(); } catch (err) { return []; }
  return arr.map(o => {
    const title = o.title || '';
    const m = title.match(/Diagram\s+(\d+[a-z]?)\s*[—-]\s*(.*)/);
    return {
      num: m ? m[1] : '?',
      title: m ? m[2] : title,
      text: (o.text ?? o.explanation ?? '').trim(),
      ex:   (o.ex   ?? o.example     ?? '').trim()
    };
  }).filter(s => s.text);
}

async function loadLibrary() {
  const jobs = [];
  for (let n = 1; n <= MAX_CH; n++) {
    jobs.push(fetch(`ch${n}_Explainer.html`, {cache: 'no-store'})
      .then(r => r.ok ? r.text() : null)
      .then(html => { if (html) { const segs = parseSegments(html); if (segs.length) LIB[n] = segs; } })
      .catch(() => {}));
  }
  await Promise.all(jobs);
  const chs = Object.keys(LIB).map(Number).sort((a,b)=>a-b);
  const total = chs.reduce((t,c)=>t+LIB[c].length, 0);
  document.getElementById('libinfo').textContent =
    chs.length ? `${chs.length} chapters · ${total} diagrams loaded` :
    'No chX_Explainer.html files found next to this index.html';
  if (!chs.length) { document.getElementById('card').textContent = 'Nothing to play.'; return; }
  buildChapterSelect(chs);
  setCurrent(chs[0], 0);
}

// ---------- UI ----------
const chSel = document.getElementById('chSel'), dgSel = document.getElementById('dgSel');

function buildChapterSelect(chs) {
  chSel.innerHTML = chs.map(c =>
    `<option value="${c}">Chapter ${c} (${LIB[c].length})</option>`).join('');
}
function buildDiagramSelect() {
  dgSel.innerHTML = LIB[cur.ch].map((s,i) =>
    `<option value="${i}">D${s.num} — ${s.title}</option>`).join('');
  dgSel.value = cur.i;
}
function setCurrent(ch, i, keepPlaying=false) {
  cur = { ch, i };
  chSel.value = ch; buildDiagramSelect();
  const s = LIB[ch][i];
  document.getElementById('card').outerHTML = `
    <div id="card" class="card">
      <div class="loc">Chapter ${ch} · Diagram ${s.num}</div>
      <div class="title">${s.title}</div>
      <div class="body">${s.text}</div>
      <div class="ex"><b>Example:</b> ${s.ex}</div>
    </div>`;
  if (!keepPlaying) stopSpeech();
}

chSel.onchange = () => setCurrent(Number(chSel.value), 0);
dgSel.onchange = () => setCurrent(cur.ch, Number(dgSel.value));

document.getElementById('randAll').onclick = () => {
  const chs = Object.keys(LIB).map(Number);
  const c = chs[Math.floor(Math.random()*chs.length)];
  setCurrent(c, Math.floor(Math.random()*LIB[c].length));
};
document.getElementById('randCh').onclick = () =>
  setCurrent(cur.ch, Math.floor(Math.random()*LIB[cur.ch].length));

// ---------- ordering: what comes after the current diagram ----------
function nextPos() {
  if (document.getElementById('shuffleMode').checked) {
    const chs = Object.keys(LIB).map(Number);
    const c = chs[Math.floor(Math.random()*chs.length)];
    return { ch: c, i: Math.floor(Math.random()*LIB[c].length) };
  }
  const chs = Object.keys(LIB).map(Number).sort((a,b)=>a-b);
  let { ch, i } = cur;
  if (i + 1 < LIB[ch].length) return { ch, i: i + 1 };
  const ci = chs.indexOf(ch);
  const nc = chs[(ci + 1) % chs.length];
  return { ch: nc, i: 0 };
}
function prevPos() {
  const chs = Object.keys(LIB).map(Number).sort((a,b)=>a-b);
  let { ch, i } = cur;
  if (i > 0) return { ch, i: i - 1 };
  const ci = chs.indexOf(ch);
  const pc = chs[(ci - 1 + chs.length) % chs.length];
  return { ch: pc, i: LIB[pc].length - 1 };
}

// ---------- speech ----------
const playBtn = document.getElementById('play'), statusEl = document.getElementById('status');

function speakCurrent() {
  const s = LIB[cur.ch][cur.i];
  const u = new SpeechSynthesisUtterance(
    `Chapter ${cur.ch}. Diagram ${s.num}. ${s.title}. ${s.text} Here is an example. ${s.ex}`);
  u.rate = parseFloat(document.getElementById('rate').value);
  u.onend = () => {
    if (!playing) return;
    if (document.getElementById('autoNext').checked) {
      const p = nextPos(); setCurrent(p.ch, p.i, true); speakCurrent();
    } else { setStopped('Finished this diagram.'); }
  };
  u.onerror = () => setStopped('Speech error — tap Play again.');
  statusEl.textContent = `Playing: Ch ${cur.ch} · D${s.num} — ${s.title}`;
  speechSynthesis.speak(u);
}
function setStopped(msg) {
  playing = false; paused = false;
  playBtn.textContent = '▶ Play'; playBtn.className = 'primary';
  statusEl.textContent = msg || 'Stopped.';
}
function stopSpeech() { speechSynthesis.cancel(); setStopped('Ready.'); }

playBtn.onclick = () => {
  if (playing && !paused) {           // -> pause
    speechSynthesis.pause(); paused = true;
    playBtn.textContent = '▶ Resume'; statusEl.textContent = 'Paused.';
    return;
  }
  if (paused) {                        // -> resume
    speechSynthesis.resume(); paused = false;
    playBtn.textContent = '⏸ Pause'; return;
  }
  speechSynthesis.cancel();            // -> fresh start
  playing = true; paused = false;
  playBtn.textContent = '⏸ Pause'; playBtn.className = 'playing';
  speakCurrent();
};
document.getElementById('next').onclick = () => {
  const wasPlaying = playing; speechSynthesis.cancel();
  const p = nextPos(); setCurrent(p.ch, p.i, wasPlaying);
  if (wasPlaying) { playing = true; playBtn.textContent = '⏸ Pause'; playBtn.className = 'playing'; speakCurrent(); }
};
document.getElementById('prev').onclick = () => {
  const wasPlaying = playing; speechSynthesis.cancel();
  const p = prevPos(); setCurrent(p.ch, p.i, wasPlaying);
  if (wasPlaying) { playing = true; playBtn.textContent = '⏸ Pause'; playBtn.className = 'playing'; speakCurrent(); }
};
document.getElementById('rate').onchange = () => {
  if (playing && !paused) { speechSynthesis.cancel(); speakCurrent(); }
};
window.addEventListener('beforeunload', () => speechSynthesis.cancel());

loadLibrary();
</script>
</body>
</html>
