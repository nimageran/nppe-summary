<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter 21 — Audio Explainer (With Applied Examples)</title>
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface2:#EEF1F8; --border:#DDE2EE; --border2:#C8CEDD;
  --accent:#2056C8; --accent-t:rgba(32,86,200,.08); --text:#1A1F35; --text2:#5B6585; --text3:#9AA0B8;
  --green:#1D9B6A; --radius:9px; --shadow:0 1px 3px rgba(26,31,53,.07), 0 4px 12px rgba(26,31,53,.04);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;padding:20px;}
.wrap{max-width:760px;margin:0 auto;}
h1{font-size:18px;font-weight:700;margin-bottom:4px;}
.sub{font-size:12px;color:var(--text3);margin-bottom:20px;}

/* Compact, non-frozen player bar: sits at the top of the flow once and
   scrolls away with the page, instead of sticking and covering content below it. */
#player{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;margin-bottom:16px;}
#now-playing{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:2px;}
#now-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;min-height:16px;}

.controls{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.ctrl-btn{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;transition:opacity .12s;}
.ctrl-btn:hover{opacity:.88;}
.ctrl-btn.secondary{background:var(--surface2);color:var(--text2);border:1px solid var(--border2);}
.ctrl-btn:disabled{opacity:.35;cursor:default;}
.rate-wrap{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);margin-left:auto;}
.rate-wrap select{border:1px solid var(--border2);border-radius:6px;padding:3px 6px;font-size:11px;font-family:inherit;background:var(--surface);color:var(--text);}

/* Single scrollable row instead of a wrapping grid — this is what made the
   bar tall enough to swallow the screen on narrower widths. */
#jumprow{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:5px;padding-bottom:3px;}
#jumprow::-webkit-scrollbar{height:4px;}
#jumprow::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.jbtn{flex:0 0 auto;width:26px;height:26px;border-radius:7px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .1s;}
.jbtn:hover{background:var(--surface2);}
.jbtn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.jbtn.done{border-color:var(--green);color:var(--green);}

#progress-line{font-size:10px;color:var(--text3);margin-top:6px;}

#edit-bar{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap;}
#edit-status{font-size:11px;color:var(--text3);}
#edit-status.err{color:#C0392B;font-weight:600;}
#edit-status.ok{color:var(--green);font-weight:600;}

.seg-text.editing,.ex-text.editing{outline:2px solid var(--accent);outline-offset:2px;background:var(--accent-t);cursor:text;}
.seg-text.dirty,.ex-text.dirty{border-left:3px solid #E8A33D;padding-left:8px;}
.edit-hint{font-size:10px;color:var(--accent);margin-top:4px;font-style:italic;}

#script{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.seg{padding:18px 22px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.seg:last-child{border-bottom:none;}
.seg:hover{background:var(--surface2);}
.seg.active{background:var(--accent-t);border-left:3px solid var(--accent);padding-left:19px;}
.seg-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--surface2);border:1px solid var(--border2);font-size:11px;font-weight:700;color:var(--text2);margin-right:8px;}
.seg.active .seg-num{background:var(--accent);border-color:var(--accent);color:#fff;}
.seg-title{display:inline;font-size:13.5px;font-weight:600;color:var(--text);}
.seg-text{margin-top:8px;font-size:13.5px;color:var(--text2);line-height:1.65;}
.ex-text{margin-top:8px;font-size:13.5px;color:var(--text);font-weight:600;background:var(--surface2);padding:10px;border-radius:6px;}

.hint{font-size:11px;color:var(--text3);text-align:center;margin-top:14px;}
</style>
</head>
<body>

<div class="wrap">
  <h1>Chapter 21 — Audio Explainer</h1>
  <div class="sub">Plain-language narration with strict engineering examples. Tap a number to jump straight to it.</div>

  <div id="player">
    <div id="now-playing">Up next</div>
    <div id="now-title">Diagram 1 — The Implied Contractual Duties</div>

    <div class="controls">
      <button class="ctrl-btn" id="btn-play">▶ Play</button>
      <button class="ctrl-btn secondary" id="btn-pause" disabled>⏸ Pause</button>
      <button class="ctrl-btn secondary" id="btn-stop" disabled>⏹ Stop</button>
      <div class="rate-wrap">
        <span>Speed</span>
        <select id="rate-select">
          <option value="0.8">0.8×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
        </select>
      </div>
    </div>

    <div id="jumprow"></div>
    <div id="progress-line">Diagram 1 of 5</div>

    <div id="edit-bar">
      <button class="ctrl-btn secondary" id="btn-enable-edit">📝 Enable Editing</button>
      <button class="ctrl-btn" id="btn-save-edit" style="display:none;">💾 Save to File</button>
      <span id="edit-status"></span>
    </div>
  </div>

  <div id="script"></div>

  <div class="hint">Uses your browser's built-in voice — no audio files, no internet required after the page loads.</div>
</div>

<script>
const SEGMENTS = [
  {
    title: "Diagram 1 — The Implied Contractual Duties",
    text: "You do not need to sign a very long and complicated contract to have employment law rules apply to you. Employment law (the laws that control the relationship between an employer and an employee) automatically creates some basic responsibilities and protections between you and your workplace. The first rule is Fidelity (the duty to be loyal to your employer). This means that while you work for a company, you cannot betray your employer by doing things like stealing trade secrets (private company information, such as a special design, formula, process, or business strategy) and using them to compete against the company. However, your employer does not own your general knowledge, skills, or experience. You are free to use your own brainpower (your skills, education, and experience) to get another job. The second rule is Competence (the duty to do your job carefully and with reasonable skill). If you make a careless mistake at work, the law often uses vicarious liability (a legal rule where one person or organization is responsible for the actions of another person) to hold the employer responsible instead of making the employee personally pay. This is because the employee was acting as part of the employer's business. The third rule is Notice (a warning period before ending employment). An employer usually cannot suddenly fire an employee without any warning. They may need to give reasonable notice (enough time for the employee to find another job) or pay severance (money given to an employee when employment ends). In simple words: Even without a detailed written contract, the law automatically adds three basic rules to most jobs: be loyal, do your work carefully, and do not lose your job suddenly without proper warning or compensation.",
    ex: "You quit your job at an aerospace firm. You are legally allowed to use your general engineering skills at a rival firm. But if you walk out with a USB drive containing your old boss's secret thruster blueprints and use them at the rival firm, you have breached the duty of fidelity and will be aggressively sued."
  },
  {
    title: "Diagram 2 — The Restrictive Covenant Gauntlet",
    text: "Some employers (companies or bosses that hire workers) ask employees to sign a non-compete clause (a part of an employment contract that says you cannot work for a competing company or start a competing business for a certain period after leaving your job). Courts (judges who decide legal disputes) are generally very cautious about enforcing these clauses because they can stop people from earning a living. For a non-compete clause to be enforceable (legally valid and likely to be upheld by a court), it must be clear and reasonable. This usually means the restrictions must clearly explain how long the employee cannot compete (time limit) and where the restriction applies (geographic area, such as a city or province). If the restrictions are too broad—for example, saying, \"You can never work anywhere in this province again\"—a judge will likely decide that the clause is unreasonable and unenforceable (the court will not enforce it). In that case, the employee is generally free to work for a competitor despite what the contract says.",
    ex: "You sign a non-compete saying you won't do structural engineering for 10 years anywhere in Canada. You quit and immediately open a rival firm next door. Your old boss sues you. The judge laughs, declares the 10-year nationwide ban absurdly broad and an illegal restraint of trade, strikes down the entire clause, and lets you keep your new business."
  },
  {
    title: "Diagram 3 — The Termination & Dismissal Matrix",
    text: "In a non-union workplace (a workplace where employees are not protected by a union agreement), the law does not usually see a situation as simply a \"layoff\" (a temporary or permanent loss of a job because the company has less work). Instead, there are three main ways an employment relationship (the legal relationship between an employer and an employee) can end. 1. Just Cause (a serious reason that allows an employer to fire someone immediately) happens when the employee does something very serious, such as stealing, fraud, or serious misconduct (bad behavior that breaks workplace rules). In this situation, the employer can fire the employee right away and usually does not have to provide severance (money paid to an employee after losing their job). 2. Without Cause (ending the job even though the employee did nothing wrong) happens when the employer decides they no longer need the employee, for example, because there is less work or the company is changing. This is allowed, but the employer usually must provide reasonable notice (advance warning before the job ends) or severance pay (money to replace the income the employee loses after termination). The amount depends on factors like the employee's age (older employees may have more difficulty finding a new job), length of service or tenure (how long the employee worked for the company), job position, and the job market. 3. Constructive Dismissal (when an employer does not officially fire someone but makes major negative changes that effectively force the employee to leave) happens when the employer seriously changes the employee's working conditions, such as cutting their salary, reducing their position, or giving them a much lower-level job. The employee can treat this as if they were fired and may be able to claim severance. Finally, if an employee loses their job, they have a duty to mitigate (a legal responsibility to reduce their own financial loss). This means the employee must make reasonable efforts to find a new job. The reason is that the employer should not have to pay for losses that could have been reduced if the employee had tried to find new work. Simple memory trick: Just Cause → Employee did something wrong → Fired immediately → No severance Without Cause → Company decision → Legal, but employer pays Constructive Dismissal → Employer makes the job unbearable → Employee can leave and claim severance Duty to Mitigate → Fired employee must try to find another job",
    ex: "Your boss suddenly cuts your salary by 20 percent and demotes you from Lead Engineer to Junior Drafter to save money. You do not have to accept this. You can legally walk out, declare Constructive Dismissal, and force your boss to pay you six months of severance pay just as if they had officially fired you."
  },
  {
    title: "Diagram 4 — The Worker Classification Spectrum (The Control Test)",
    text: "You cannot simply write \"Independent Contractor\" on a contract (a written agreement between people or companies) and expect the law to accept it. The government looks at what is actually happening in real life, not just what the paper says. If a boss (the person or company that hires someone to do work) controls how you do your job, tells you exactly what steps to follow, gives you the equipment you need (such as a laptop or tools), and pays you a regular fixed amount (a set payment that does not change based on the project result), then you are usually considered an Employee (a worker who works under the control of a company or person). In this situation, the boss has certain legal responsibilities, such as paying required taxes (money paid to the government) and being vicariously liable (legally responsible for the mistakes or damages caused by an employee while doing their job). On the other hand, if you are an Independent Contractor (a person who works for themselves and provides services to clients instead of being a regular employee), you usually have more control over your work. For example, you may use your own tools, work for several clients (different customers or companies), decide how to complete the job, and take the risk of losing your own money if the business does not go well. In that case, you are more likely to be considered a true Independent Contractor, and you are usually responsible for your own taxes and business risks. Simple NPPE memory trick: Employee = \"How you work is controlled by the boss.\" Independent Contractor = \"You control how you work and accept the business risk.\" The name on the paper does not decide the answer; the real working relationship does.",
    ex: "You work at a firm from 9 to 5, using their AutoCAD software, and the boss dictates your daily tasks. To avoid paying benefits, the boss asks you to sign an 'Independent Contractor' agreement. When the CRA audits the firm, they look at the absolute control the boss has over you, declare you an employee, and hit the boss with massive tax penalties."
  },
  {
    title: "Diagram 5 — The Triad of Employee Remedies",
    text: "If you are wrongfully fired (your employer fires you in a way that breaks the law or violates your employment rights), you have three possible ways to fight back. Think of them as three different tools you can use, depending on what happened. Tool 1: Common Law Court (a regular court where you hire a lawyer and bring a legal case). You usually have to pay for your own lawyer, but if you win, you may receive a large amount of money called severance (money an employer may have to pay after ending your job unfairly). This amount can sometimes equal many months or even a year or more of your salary, depending on the situation. Tool 2: Employment Standards Branch (a government office that handles basic employee rights and workplace rules). This option is usually free because the government process helps investigate the problem. However, the amount of money you can receive is usually limited to the minimum amount required by employment laws (the basic payment set by the government). Also, some professionals, such as engineers, may not be covered by these rules because they can be excluded under certain employment laws. Tool 3: Human Rights Tribunal (a special legal body that deals with unfair treatment based on protected characteristics, such as race, religion, or disability). This option is used when someone believes they were fired because of discrimination (unfair treatment because of who they are or a protected personal characteristic). Unlike a normal court, a Human Rights Tribunal can sometimes order the employer to reinstate the employee (give the person their old job back). This is something regular courts usually do not order. In simple words: Common Law Court = expensive but can give large money awards. Employment Standards Branch = free but usually gives only minimum payments. Human Rights Tribunal = used for discrimination cases and can force the employer to give the job back.",
    ex: "You are fired because you need a wheelchair and the private firm refuses to build a ramp. You cannot use the Charter of Rights, because that only restrains the government, not private companies. Instead, you go to the provincial Human Rights Tribunal, which forces the firm to build the ramp, pay you damages, and physically reinstate you at your desk."
  },
];
let currentIndex = 0;
let isPlaying = false;
let isPaused = false;
let utterance = null;

const jumprow = document.getElementById('jumprow');
const scriptBox = document.getElementById('script');
const nowTitle = document.getElementById('now-title');
const nowPlaying = document.getElementById('now-playing');
const progressLine = document.getElementById('progress-line');
const btnPlay = document.getElementById('btn-play');
const btnPause = document.getElementById('btn-pause');
const btnStop = document.getElementById('btn-stop');
const rateSelect = document.getElementById('rate-select');

SEGMENTS.forEach((seg, i) => {
  const jb = document.createElement('button');
  jb.className = 'jbtn';
  jb.textContent = i + 1;
  jb.title = seg.title;
  jb.onclick = () => jumpTo(i, true);
  jumprow.appendChild(jb);

  const block = document.createElement('div');
  block.className = 'seg';
  block.id = 'seg-' + i;
  
  block.innerHTML = `
    <span class="seg-num">${i+1}</span>
    <span class="seg-title">${seg.title.replace(/^Diagram \d+ — /,'')}</span>
    <div class="seg-text" data-idx="${i}" data-field="text">${seg.text}</div>
    <div class="ex-text"><strong class="ex-label">Example:</strong> <span class="ex-content" data-idx="${i}" data-field="ex">${seg.ex}</span></div>
  `;
  block.onclick = (e) => {
    if (editingEnabled) return;
    jumpTo(i, true);
  };
  scriptBox.appendChild(block);
});

function refreshUI() {
  document.querySelectorAll('.jbtn').forEach((b, i) => {
    b.classList.toggle('active', i === currentIndex && isPlaying);
    b.classList.toggle('done', i < currentIndex);
  });
  document.querySelectorAll('.seg').forEach((s, i) => {
    s.classList.toggle('active', i === currentIndex);
  });
  nowTitle.textContent = SEGMENTS[currentIndex].title;
  nowPlaying.textContent = isPlaying ? (isPaused ? 'Paused' : 'Now playing') : 'Up next';
  progressLine.textContent = `Diagram ${currentIndex + 1} of ${SEGMENTS.length}`;
  btnPlay.disabled = isPlaying && !isPaused;
  btnPause.disabled = !isPlaying || isPaused;
  btnStop.disabled = !isPlaying;
  if (isPlaying) {
    const el = document.getElementById('seg-' + currentIndex);
    if (el) el.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  }
}

function speakCurrent() {
  window.speechSynthesis.cancel();
  
  const fullAudioText = SEGMENTS[currentIndex].text + " " + SEGMENTS[currentIndex].ex;
  
  utterance = new SpeechSynthesisUtterance(fullAudioText);
  utterance.rate = parseFloat(rateSelect.value);
  utterance.onend = () => {
    if (currentIndex < SEGMENTS.length - 1) {
      currentIndex++;
      refreshUI();
      speakCurrent();
    } else {
      isPlaying = false;
      isPaused = false;
      refreshUI();
    }
  };
  isPlaying = true;
  isPaused = false;
  refreshUI();
  window.speechSynthesis.speak(utterance);
}

function jumpTo(i, autoplay) {
  currentIndex = i;
  window.speechSynthesis.cancel();
  isPlaying = false;
  isPaused = false;
  refreshUI();
  if (autoplay) speakCurrent();
}

btnPlay.onclick = () => {
  if (isPaused) {
    window.speechSynthesis.resume();
    isPaused = false;
    isPlaying = true;
    refreshUI();
  } else {
    speakCurrent();
  }
};
btnPause.onclick = () => {
  window.speechSynthesis.pause();
  isPaused = true;
  refreshUI();
};
btnStop.onclick = () => {
  window.speechSynthesis.cancel();
  isPlaying = false;
  isPaused = false;
  refreshUI();
};
rateSelect.onchange = () => {
  if (isPlaying) speakCurrent();
};

window.addEventListener('beforeunload', () => window.speechSynthesis.cancel());

refreshUI();

// --- INLINE EDITING + DIRECT FILE SAVE ---
// Lets you edit the text/example of any diagram right on this page and
// save the changes straight back into this .html file on disk.
let editingEnabled = false;
let fileHandle = null;
let dirtyFields = new Set(); // "idx-field" keys, e.g. "3-ex"

const btnEnableEdit = document.getElementById('btn-enable-edit');
const btnSaveEdit   = document.getElementById('btn-save-edit');
const editStatus    = document.getElementById('edit-status');

function setEditStatus(msg, cls) {
  editStatus.textContent = msg;
  editStatus.className = cls || '';
}

btnEnableEdit.onclick = async () => {
  if (!('showOpenFilePicker' in window)) {
    setEditStatus('Your browser doesn\'t support direct file saving (needs Chrome or Edge). Edit in a text editor instead.', 'err');
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'HTML files', accept: { 'text/html': ['.html'] } }],
      excludeAcceptAllOption: false,
      multiple: false
    });
    const expectedName = document.title.match(/Chapter (\d+)/);
    if (expectedName && !handle.name.toLowerCase().includes(`ch${expectedName[1]}_explainer`)) {
      const proceed = confirm(`You picked "${handle.name}", but this page is "${document.title}". Continue anyway?`);
      if (!proceed) return;
    }
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') {
      setEditStatus('Permission to edit was not granted.', 'err');
      return;
    }
    fileHandle = handle;
    editingEnabled = true;
    document.querySelectorAll('.seg-text, .ex-content').forEach(el => {
      el.contentEditable = 'true';
      el.classList.add('editing');
      el.addEventListener('input', () => {
        const key = el.dataset.idx + '-' + el.dataset.field;
        dirtyFields.add(key);
        (el.classList.contains('ex-content') ? el.parentElement : el).classList.add('dirty');
        btnSaveEdit.textContent = `💾 Save to File (${dirtyFields.size} unsaved)`;
      });
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) e.preventDefault();
      });
    });
    btnEnableEdit.style.display = 'none';
    btnSaveEdit.style.display = 'inline-flex';
    setEditStatus('Editing on — click any explanation or example to change it.', 'ok');
  } catch (err) {
    if (err.name !== 'AbortError') setEditStatus('Could not open file: ' + err.message, 'err');
  }
};

function toJSStringLiteral(raw) {
  const cleaned = raw.replace(/\s+/g, ' ').trim();
  return '"' + cleaned.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
}

btnSaveEdit.onclick = async () => {
  if (!fileHandle) return;
  if (dirtyFields.size === 0) {
    setEditStatus('Nothing to save — no changes made yet.', '');
    return;
  }
  try {
    setEditStatus('Saving…', '');

    const lines = ['const SEGMENTS = ['];
    document.querySelectorAll('.seg').forEach((block, i) => {
      const textEl = block.querySelector('.seg-text');
      const exEl   = block.querySelector('.ex-content');
      const title  = SEGMENTS[i].title;
      lines.push('  {');
      lines.push('    title: ' + toJSStringLiteral(title) + ',');
      lines.push('    text: ' + toJSStringLiteral(textEl.innerText) + ',');
      lines.push('    ex: ' + toJSStringLiteral(exEl.innerText));
      lines.push('  },');
    });
    lines.push('];');
    const newBlock = lines.join('\n') + '\n';

    const file = await fileHandle.getFile();
    const currentText = await file.text();
    const s = currentText.indexOf('const SEGMENTS = [');
    const e = currentText.indexOf('let currentIndex = 0;');
    if (s === -1 || e === -1) throw new Error('Could not locate the SEGMENTS block in the file — nothing was saved.');

    const newFileText = currentText.slice(0, s) + newBlock + currentText.slice(e);
    const writable = await fileHandle.createWritable();
    await writable.write(newFileText);
    await writable.close();

    document.querySelectorAll('.seg').forEach((block, i) => {
      SEGMENTS[i].text = block.querySelector('.seg-text').innerText.trim();
      SEGMENTS[i].ex   = block.querySelector('.ex-content').innerText.trim();
      block.querySelectorAll('.dirty').forEach(el => el.classList.remove('dirty'));
    });
    dirtyFields.clear();
    btnSaveEdit.textContent = '💾 Save to File';
    setEditStatus(`Saved — ${new Date().toLocaleTimeString()}. Refresh anytime to confirm.`, 'ok');
  } catch (err) {
    setEditStatus('Save failed: ' + err.message, 'err');
  }
};
// --- END INLINE EDITING ---

</script>
</body>
</html>
