<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter 8 — Audio Explainer (With Applied Examples)</title>
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface2:#EEF1F8; --border:#DDE2EE; --border2:#C8CEDD;
  --accent:#2056C8; --accent-t:rgba(32,86,200,.08); --text:#1A1F35; --text2:#5B6585; --text3:#9AA0B8;
  --green:#1D9B6A; --radius:9px; --shadow:0 1px 3px rgba(26,31,53,.07), 0 4px 12px rgba(26,31,53,.04);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;padding:20px;}
.wrap{max-width:760px;margin:0 auto;}
h1{font-size:18px;font-weight:700;margin-bottom:4px;}
.sub{font-size:12px;color:var(--text3);margin-bottom:20px;}

/* Compact, non-frozen player bar: sits at the top of the flow once and
   scrolls away with the page, instead of sticking and covering content below it. */
#player{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;margin-bottom:16px;}
#now-playing{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:2px;}
#now-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;min-height:16px;}

.controls{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.ctrl-btn{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;transition:opacity .12s;}
.ctrl-btn:hover{opacity:.88;}
.ctrl-btn.secondary{background:var(--surface2);color:var(--text2);border:1px solid var(--border2);}
.ctrl-btn:disabled{opacity:.35;cursor:default;}
.rate-wrap{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);margin-left:auto;}
.rate-wrap select{border:1px solid var(--border2);border-radius:6px;padding:3px 6px;font-size:11px;font-family:inherit;background:var(--surface);color:var(--text);}

/* Single scrollable row instead of a wrapping grid — this is what made the
   bar tall enough to swallow the screen on narrower widths. */
#jumprow{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:5px;padding-bottom:3px;}
#jumprow::-webkit-scrollbar{height:4px;}
#jumprow::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.jbtn{flex:0 0 auto;width:26px;height:26px;border-radius:7px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .1s;}
.jbtn:hover{background:var(--surface2);}
.jbtn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.jbtn.done{border-color:var(--green);color:var(--green);}

#progress-line{font-size:10px;color:var(--text3);margin-top:6px;}

#edit-bar{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap;}
#edit-status{font-size:11px;color:var(--text3);}
#edit-status.err{color:#C0392B;font-weight:600;}
#edit-status.ok{color:var(--green);font-weight:600;}

.seg-text.editing,.ex-text.editing{outline:2px solid var(--accent);outline-offset:2px;background:var(--accent-t);cursor:text;}
.seg-text.dirty,.ex-text.dirty{border-left:3px solid #E8A33D;padding-left:8px;}
.edit-hint{font-size:10px;color:var(--accent);margin-top:4px;font-style:italic;}

#script{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.seg{padding:18px 22px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.seg:last-child{border-bottom:none;}
.seg:hover{background:var(--surface2);}
.seg.active{background:var(--accent-t);border-left:3px solid var(--accent);padding-left:19px;}
.seg-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--surface2);border:1px solid var(--border2);font-size:11px;font-weight:700;color:var(--text2);margin-right:8px;}
.seg.active .seg-num{background:var(--accent);border-color:var(--accent);color:#fff;}
.seg-title{display:inline;font-size:13.5px;font-weight:600;color:var(--text);}
.seg-text{margin-top:8px;font-size:13.5px;color:var(--text2);line-height:1.65;}
.ex-text{margin-top:8px;font-size:13.5px;color:var(--text);font-weight:600;background:var(--surface2);padding:10px;border-radius:6px;}

.hint{font-size:11px;color:var(--text3);text-align:center;margin-top:14px;}
</style>
</head>
<body>

<div class="wrap">
  <h1>Chapter 8 — Audio Explainer</h1>
  <div class="sub">Plain-language narration with strict engineering examples. Tap a number to jump straight to it.</div>

  <div id="player">
    <div id="now-playing">Up next</div>
    <div id="now-title">Diagram 1 — The Interpretation Threshold Gate</div>

    <div class="controls">
      <button class="ctrl-btn" id="btn-play">▶ Play</button>
      <button class="ctrl-btn secondary" id="btn-pause" disabled>⏸ Pause</button>
      <button class="ctrl-btn secondary" id="btn-stop" disabled>⏹ Stop</button>
      <div class="rate-wrap">
        <span>Speed</span>
        <select id="rate-select">
          <option value="0.8">0.8×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
        </select>
      </div>
    </div>

    <div id="jumprow"></div>
    <div id="progress-line">Diagram 1 of 7</div>

    <div id="edit-bar">
      <button class="ctrl-btn secondary" id="btn-enable-edit">📝 Enable Editing</button>
      <button class="ctrl-btn" id="btn-save-edit" style="display:none;">💾 Save to File</button>
      <span id="edit-status"></span>
    </div>
  </div>

  <div id="script"></div>

  <div class="hint">Uses your browser's built-in voice — no audio files, no internet required after the page loads.</div>
</div>

<script>
const SEGMENTS = [
  {
    title: "Diagram 1 — The Interpretation Threshold Gate",
    text: "Courts do not exist to rewrite bad deals or figure out what is fair. If your contract is perfectly clear, the court applies the exact literal meaning, even if it destroys your company financially. Interpretation only happens if the words are genuinely ambiguous and confusing. And even when interpreting, a judge cannot magically invent new terms that the parties never actually agreed to. Courts (courts are the official legal system where judges decide disputes) are not there to rewrite a contract (a contract is a legally enforceable agreement between two or more people or businesses) just because one side later realizes it made a bad deal. They also do not decide cases based on what seems fair. If the wording of the contract is clear (easy to understand and has only one reasonable meaning), the court will apply those exact words, even if doing so causes one company to lose a lot of money or even go out of business. A court will only interpret (figure out the intended meaning of) a contract if its words are ambiguous (unclear or able to be understood in more than one reasonable way). Even then, a judge (judge is the person in court who applies the law and decides the case) cannot make up new promises or add new terms (rules or conditions in the contract) that the parties (parties are the people or businesses that signed the contract) never actually agreed to.",
    ex: "You sign a contract saying you will deliver 'exactly 500 tons of steel by Tuesday.' You deliver 400 tons and ask the judge to be lenient because of a factory delay. The judge refuses to interpret anything. The words are clear, you broke the contract, and you pay the penalty."
  },
  {
    title: "Diagram 2 — Objective vs Subjective Intention",
    text: "The biggest mistake people make in court (the place where a judge decides legal disputes) is arguing about what they privately meant (their own secret thoughts or intentions) when they signed a contract (a legally enforceable agreement between two or more people or businesses). The law does not care about your secret thoughts if no one else could know them. Instead, the court uses an objective standard (a fair rule that ignores personal opinions and asks what an average, reasonable person would think). In other words, the judge asks: \"If a reasonable stranger (an ordinary person with no special knowledge of the situation) read these exact words, what would they think the contract means?\" Your private intentions (what you secretly wanted or believed) do not matter if you did not clearly write them into the contract. In contract law, what is written and can be understood by others is much more important than what you were secretly thinking.",
    ex: "You write a contract saying 'remove all hazardous soil.' You secretly only meant the top layer of dirt, but you didn't write that down. The objective, reasonable outsider reading that sentence would assume it means all the dirt down to bedrock. You are legally forced to dig to bedrock."
  },
  {
    title: "Diagram 3 — The Canons Working Together",
    text: "Sometimes a contract contains ambiguous words (words or sentences that can be understood in more than one way). When this happens, a judge (the person in court who decides how the law should be applied) uses a set of rules called canons of construction (guidelines that help judges figure out what the contract really means). The judge first looks at the plain meaning (the ordinary, everyday meaning of the words), any technical definitions (special meanings used in a particular profession or industry), commercial common sense (the interpretation that makes the most practical business sense), and the contract as a whole (reading the entire contract instead of focusing on just one sentence). If the meaning is still unclear, the judge may use a final rule called contra proferentem (a Latin legal rule meaning that unclear wording is interpreted against the person who wrote it). In other words, if one party wrote a confusing clause, the judge will usually interpret that clause in favor of the other party (the person or company who did not write it). This encourages people to write contracts clearly and not leave confusing language that could benefit them later.",
    ex: "You write a messy, confusing contract for a client saying 'ensure adequate ventilation.' Does that mean one fan or ten? Because you drafted the confusing document, the judge uses the contra proferentem rule against you, and lets the client decide that one cheap fan is perfectly adequate."
  },
  {
    title: "Diagram 4 — The Conflict-Resolution Hierarchy",
    text: "Sometimes, two parts of the same contract (a contract is a legally binding agreement between two or more people or companies) say different or opposite things. This is called a contradiction (when two statements cannot both be true). When this happens, the court (the legal system that decides disputes) follows a rule to decide which part of the contract should be followed. Special conditions (extra terms that were written specifically for this particular project or situation) are more important than boilerplate conditions (standard, pre-written terms that are copied into many contracts without changing much). The law assumes that the special conditions better reflect what the parties intended (what they actually wanted and agreed to) because they were written specifically for this contract, while the boilerplate conditions are just a general template (a standard form used over and over again). Therefore, if a special condition and a boilerplate condition conflict with each other, the special condition wins and is the one the court will follow.",
    ex: "The standard boilerplate CCDC contract says 'contractor pays for weather delays.' But in the customized 'Supplementary Conditions' appendix, you typed 'owner pays for rain delays.' The customized typing completely overrides the boilerplate, so the owner pays."
  },
  {
    title: "Diagram 5 — The Parol Evidence Rule and Its Exceptions",
    text: "The core rule: the \"brick wall\". Once a contract is signed in writing, courts treat that document as the complete deal. You can't later point to an email or a conversation from before signing and say \"but we really meant something else.\" Example: A supplier and a manufacturer sign a written contract stating \"500 units at $10/unit, delivered monthly.\" Before signing, an email exchange mentioned a possible discount for early payment. After signing, the manufacturer tries to argue the $10 price should really be $9 because of that email. The court won't allow the email to override the signed contract — the written price term controls. Why the rule exists? The law assumes that if something mattered enough to the parties, they would have put it in the final document. The signed contract is presumed to be the full and final record of the deal. Example: Two companies negotiate for months, with dozens of draft terms discussed by phone. The final signed contract omits a clause about \"free technical support for one year\" that was discussed in an early call but dropped from later drafts. One party can't later demand free support by pointing to that early call — the final signed version is what counts. Exception 1: Factual matrix (background facts). A judge can look at the surrounding circumstances that existed when the contract was made — not to change the words, but to understand what the words meant in context. This isn't about proving a different deal; it's about interpreting the deal that's on paper. Example: A contract says \"the goods will be shipped in the usual manner.\" Nobody defines \"usual manner\" in the contract. The judge can look at the parties' industry and prior dealings (e.g., they always used refrigerated freight for this type of product) to understand what \"usual manner\" was intended to mean — without altering any actual wording. Exception 2: Ambiguity + subsequent conduct. If the contract's wording is genuinely open to more than one reasonable meaning, a judge may look at how the parties behaved after signing to figure out which meaning they intended. Example: A contract says payments are due \"monthly.\" It's unclear whether that means the 1st of each month or within 30 days of invoice. After signing, the buyer has paid on the 1st of every month for a year without objection from the seller. A judge could point to that consistent post-signing conduct as evidence that \"monthly\" meant \"on the 1st.\"",
    ex: "During negotiations, the owner verbally promises you a $10,000 bonus, but it is left out of the final signed contract. Under the strict Parol Evidence Rule, that verbal promise is dead and inadmissible in court. You get nothing."
  },
  {
    title: "Diagram 6 — Chinook Aggregates: The Privilege Clause",
    text: "Imagine a company asks several contractors to submit their prices for a construction project. This process is called a tender (a tender is a formal process where companies submit offers or bids to get a job). The company may write a rule saying: \"The lowest bid will not necessarily be accepted\" (meaning the company does not have to choose the cheapest offer). However, this rule does not give the company unlimited power to choose anyone they want. The Chinook Aggregates case (a Canadian legal case about tendering rules) showed that this rule only gives the company limited choices: they can either cancel the whole project or reject the lowest bidder for a valid, disclosed reason (a reason that was clearly stated or made known to the bidders). The company cannot secretly decide, \"I like this contractor more,\" or choose their friend because of a hidden reason that was never shared with the bidders. In simple words, this clause gives the company some flexibility, but it does not give them the power to ignore fairness or secretly choose whoever they want. Easy example: Imagine your teacher asks students to compete for a group project and says: \"The student with the highest grade will not necessarily be chosen.\" This does not mean the teacher can choose their favourite student for no reason. It only means they can consider other valid factors, such as teamwork skills or experience, if those factors are reasonable and known beforehand. They cannot secretly say: \"I chose my friend because I like them.\" The same idea applies to construction tenders.",
    ex: "You use a privilege clause to ignore the $50,000 lowest bid and award the job to your buddy's $60,000 bid because you like him. The lowest bidder sues you. The court rules you breached the contract because 'I like my buddy' was not an official, disclosed evaluation criteria."
  },
  {
    title: "Diagram 7 — The Contract Quality Spectrum",
    text: "Not all contracts (legally enforceable agreements between two or more people or companies) are equally good. Some are very clear and detailed, while others are risky and can easily lead to disagreements. The best type of contract is a carefully discussed (negotiated means both sides talked about and agreed on the terms) and clearly written document. As you move toward simpler forms—such as a purchase order (a document a buyer sends to order goods or services), an email confirmation (an email confirming that both sides agree), and finally a purely oral agreement (an agreement made only by speaking, with nothing written down)—the risk (the chance of future problems or disputes) becomes much higher. This is because, if there is a disagreement, an oral contract gives the judge (the person in court who decides the case) no written evidence to rely on. Instead, the judge must figure out what probably happened by listening to witness testimony (what the people involved or other witnesses say happened), which can be incomplete, inconsistent, or different from one person to another. Written contracts are much easier because they provide clear evidence of what everyone agreed to.",
    ex: "You shake hands on a $100,000 piping job at a bar with zero paperwork. A year later, you demand payment, but the client claims you agreed to $50,000. Because it is a purely oral contract, there is no proof. You end up in a brutal, expensive trial where the judge just has to guess who is lying."
  },
];
let currentIndex = 0;
let isPlaying = false;
let isPaused = false;
let utterance = null;

const jumprow = document.getElementById('jumprow');
const scriptBox = document.getElementById('script');
const nowTitle = document.getElementById('now-title');
const nowPlaying = document.getElementById('now-playing');
const progressLine = document.getElementById('progress-line');
const btnPlay = document.getElementById('btn-play');
const btnPause = document.getElementById('btn-pause');
const btnStop = document.getElementById('btn-stop');
const rateSelect = document.getElementById('rate-select');

SEGMENTS.forEach((seg, i) => {
  const jb = document.createElement('button');
  jb.className = 'jbtn';
  jb.textContent = i + 1;
  jb.title = seg.title;
  jb.onclick = () => jumpTo(i, true);
  jumprow.appendChild(jb);

  const block = document.createElement('div');
  block.className = 'seg';
  block.id = 'seg-' + i;
  
  block.innerHTML = `
    <span class="seg-num">${i+1}</span>
    <span class="seg-title">${seg.title.replace(/^Diagram \d+ — /,'')}</span>
    <div class="seg-text" data-idx="${i}" data-field="text">${seg.text}</div>
    <div class="ex-text"><strong class="ex-label">Example:</strong> <span class="ex-content" data-idx="${i}" data-field="ex">${seg.ex}</span></div>
  `;
  block.onclick = (e) => {
    if (editingEnabled) return;
    jumpTo(i, true);
  };
  scriptBox.appendChild(block);
});

function refreshUI() {
  document.querySelectorAll('.jbtn').forEach((b, i) => {
    b.classList.toggle('active', i === currentIndex && isPlaying);
    b.classList.toggle('done', i < currentIndex);
  });
  document.querySelectorAll('.seg').forEach((s, i) => {
    s.classList.toggle('active', i === currentIndex);
  });
  nowTitle.textContent = SEGMENTS[currentIndex].title;
  nowPlaying.textContent = isPlaying ? (isPaused ? 'Paused' : 'Now playing') : 'Up next';
  progressLine.textContent = `Diagram ${currentIndex + 1} of ${SEGMENTS.length}`;
  btnPlay.disabled = isPlaying && !isPaused;
  btnPause.disabled = !isPlaying || isPaused;
  btnStop.disabled = !isPlaying;
  if (isPlaying) {
    const el = document.getElementById('seg-' + currentIndex);
    if (el) el.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  }
}

function speakCurrent() {
  window.speechSynthesis.cancel();
  
  const fullAudioText = SEGMENTS[currentIndex].text + " " + SEGMENTS[currentIndex].ex;
  
  utterance = new SpeechSynthesisUtterance(fullAudioText);
  utterance.rate = parseFloat(rateSelect.value);
  utterance.onend = () => {
    if (currentIndex < SEGMENTS.length - 1) {
      currentIndex++;
      refreshUI();
      speakCurrent();
    } else {
      isPlaying = false;
      isPaused = false;
      refreshUI();
    }
  };
  isPlaying = true;
  isPaused = false;
  refreshUI();
  window.speechSynthesis.speak(utterance);
}

function jumpTo(i, autoplay) {
  currentIndex = i;
  window.speechSynthesis.cancel();
  isPlaying = false;
  isPaused = false;
  refreshUI();
  if (autoplay) speakCurrent();
}

btnPlay.onclick = () => {
  if (isPaused) {
    window.speechSynthesis.resume();
    isPaused = false;
    isPlaying = true;
    refreshUI();
  } else {
    speakCurrent();
  }
};
btnPause.onclick = () => {
  window.speechSynthesis.pause();
  isPaused = true;
  refreshUI();
};
btnStop.onclick = () => {
  window.speechSynthesis.cancel();
  isPlaying = false;
  isPaused = false;
  refreshUI();
};
rateSelect.onchange = () => {
  if (isPlaying) speakCurrent();
};

window.addEventListener('beforeunload', () => window.speechSynthesis.cancel());

refreshUI();

// --- INLINE EDITING + DIRECT FILE SAVE ---
// Lets you edit the text/example of any diagram right on this page and
// save the changes straight back into this .html file on disk.
let editingEnabled = false;
let fileHandle = null;
let dirtyFields = new Set(); // "idx-field" keys, e.g. "3-ex"

const btnEnableEdit = document.getElementById('btn-enable-edit');
const btnSaveEdit   = document.getElementById('btn-save-edit');
const editStatus    = document.getElementById('edit-status');

function setEditStatus(msg, cls) {
  editStatus.textContent = msg;
  editStatus.className = cls || '';
}

btnEnableEdit.onclick = async () => {
  if (!('showOpenFilePicker' in window)) {
    setEditStatus('Your browser doesn\'t support direct file saving (needs Chrome or Edge). Edit in a text editor instead.', 'err');
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'HTML files', accept: { 'text/html': ['.html'] } }],
      excludeAcceptAllOption: false,
      multiple: false
    });
    const expectedName = document.title.match(/Chapter (\d+)/);
    if (expectedName && !handle.name.toLowerCase().includes(`ch${expectedName[1]}_explainer`)) {
      const proceed = confirm(`You picked "${handle.name}", but this page is "${document.title}". Continue anyway?`);
      if (!proceed) return;
    }
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') {
      setEditStatus('Permission to edit was not granted.', 'err');
      return;
    }
    fileHandle = handle;
    editingEnabled = true;
    document.querySelectorAll('.seg-text, .ex-content').forEach(el => {
      el.contentEditable = 'true';
      el.classList.add('editing');
      el.addEventListener('input', () => {
        const key = el.dataset.idx + '-' + el.dataset.field;
        dirtyFields.add(key);
        (el.classList.contains('ex-content') ? el.parentElement : el).classList.add('dirty');
        btnSaveEdit.textContent = `💾 Save to File (${dirtyFields.size} unsaved)`;
      });
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) e.preventDefault();
      });
    });
    btnEnableEdit.style.display = 'none';
    btnSaveEdit.style.display = 'inline-flex';
    setEditStatus('Editing on — click any explanation or example to change it.', 'ok');
  } catch (err) {
    if (err.name !== 'AbortError') setEditStatus('Could not open file: ' + err.message, 'err');
  }
};

function toJSStringLiteral(raw) {
  const cleaned = raw.replace(/\s+/g, ' ').trim();
  return '"' + cleaned.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
}

btnSaveEdit.onclick = async () => {
  if (!fileHandle) return;
  if (dirtyFields.size === 0) {
    setEditStatus('Nothing to save — no changes made yet.', '');
    return;
  }
  try {
    setEditStatus('Saving…', '');

    const lines = ['const SEGMENTS = ['];
    document.querySelectorAll('.seg').forEach((block, i) => {
      const textEl = block.querySelector('.seg-text');
      const exEl   = block.querySelector('.ex-content');
      const title  = SEGMENTS[i].title;
      lines.push('  {');
      lines.push('    title: ' + toJSStringLiteral(title) + ',');
      lines.push('    text: ' + toJSStringLiteral(textEl.innerText) + ',');
      lines.push('    ex: ' + toJSStringLiteral(exEl.innerText));
      lines.push('  },');
    });
    lines.push('];');
    const newBlock = lines.join('\n') + '\n';

    const file = await fileHandle.getFile();
    const currentText = await file.text();
    const s = currentText.indexOf('const SEGMENTS = [');
    const e = currentText.indexOf('let currentIndex = 0;');
    if (s === -1 || e === -1) throw new Error('Could not locate the SEGMENTS block in the file — nothing was saved.');

    const newFileText = currentText.slice(0, s) + newBlock + currentText.slice(e);
    const writable = await fileHandle.createWritable();
    await writable.write(newFileText);
    await writable.close();

    document.querySelectorAll('.seg').forEach((block, i) => {
      SEGMENTS[i].text = block.querySelector('.seg-text').innerText.trim();
      SEGMENTS[i].ex   = block.querySelector('.ex-content').innerText.trim();
      block.querySelectorAll('.dirty').forEach(el => el.classList.remove('dirty'));
    });
    dirtyFields.clear();
    btnSaveEdit.textContent = '💾 Save to File';
    setEditStatus(`Saved — ${new Date().toLocaleTimeString()}. Refresh anytime to confirm.`, 'ok');
  } catch (err) {
    setEditStatus('Save failed: ' + err.message, 'err');
  }
};
// --- END INLINE EDITING ---

</script>
</body>
</html>
